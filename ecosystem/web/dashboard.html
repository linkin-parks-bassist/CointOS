<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CointOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<style>
:root {
  --night: #1C1A33;
  --night-deep: #15142A;
  --panel: #252343;
  --rule: #38355E;
  --paper: #EFE7D6;
  --paper-dim: #A9A3BF;
  --paper-faint: #6E6990;
  --worker: #F2B84B;
  --manager: #7FD1B9;
  --steward: #B8A1E3;
  --survivor: #FF7A6B;
  --coin: #72C7FF;
  --other: #C9C3DA;
  --good: #7FD1B9;
  --bad: #FF7A6B;
  --wait: #F2B84B;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { background: var(--night-deep); }
body {
  margin: 0; color: var(--paper); font: 15px/1.5 var(--body);
  font-variant-numeric: tabular-nums;
  background:
    radial-gradient(1200px 520px at 70% -10%, #2B2854 0%, transparent 70%),
    var(--night-deep);
  min-height: 100vh;
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--coin); outline-offset: 3px; }

.page { max-width: 1280px; margin: 0 auto; padding: 28px 28px 48px; }

/* masthead */
.mast { display: flex; align-items: baseline; gap: 20px; flex-wrap: wrap; }
.mark {
  font: 800 44px/1 var(--display); letter-spacing: -0.02em; margin: 0;
}
.mark .o { display: inline-block; color: var(--night-deep);
  background: var(--paper); border-radius: 50%; width: .78em; height: .78em;
  line-height: .78em; text-align: center; font-size: .9em; transform: translateY(-.04em); }
.summary { font: 500 19px/1.3 var(--display); color: var(--paper-dim); margin: 0; flex: 1 1 320px; }
.summary b { color: var(--paper); font-weight: 800; }
.pulse { display: inline-block; width: 9px; height: 9px; border-radius: 50%;
  background: var(--good); margin-right: 8px; vertical-align: middle;
  box-shadow: 0 0 0 0 var(--good); animation: breathe 2.4s ease-in-out infinite; }
.pulse.warn { background: var(--wait); }
.pulse.bad { background: var(--bad); }
.stamp { color: var(--paper-faint); font-size: 13px; }

.alert { margin: 18px 0 0; padding: 12px 16px; border-radius: 10px;
  background: #3A2236; border: 1px solid #6B3446; color: #FFD9D3; display: none; }
.alert.show { display: block; }

/* stage */
.stage {
  position: relative; margin: 26px 0 0; height: 440px; border-radius: 28px;
  background:
    radial-gradient(420px 260px at 88% 8%, rgba(184,161,227,.10), transparent 70%),
    linear-gradient(180deg, #211F3C 0%, var(--night) 100%);
  border: 1px solid var(--rule); overflow: hidden;
}
.zone-label { position: absolute; font: 500 14px/1 var(--display); color: var(--paper-faint); }
.zone-label.waiting { left: 26px; top: 22px; }
.zone-label.void { right: 26px; top: 22px; text-align: right; }
.wells { position: absolute; inset: 0; }
.well {
  position: absolute; bottom: 64px; width: 150px; border-radius: 75px;
  background: rgba(21,20,42,.55); border: 1px solid var(--rule);
  display: flex; flex-direction: column-reverse; align-items: center; gap: 14px;
  padding: 22px 0;
}
.well.control { opacity: .72; }
.well.busy { border-color: #5A5690; box-shadow: inset 0 0 40px rgba(127,209,185,.06); }
.slot { width: 92px; height: 92px; border-radius: 50%;
  border: 1.5px dashed #4A4675; }
.well-name { position: absolute; bottom: -50px; left: 50%; transform: translateX(-50%);
  width: 220px; text-align: center; }
.well-name strong { display: block; font: 800 16px/1.2 var(--display); }
.well-name span { font-size: 13px; color: var(--paper-dim); }

.orb {
  position: absolute; left: 0; top: 0; width: 92px; height: 92px; margin: -46px 0 0 -46px;
  transition: transform 1.4s cubic-bezier(.22,.8,.2,1), opacity 1.4s ease;
  will-change: transform;
}
.orb .core {
  position: absolute; inset: 16px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff8 0%, var(--c) 38%, color-mix(in oklab, var(--c) 55%, #000) 100%);
  box-shadow: 0 0 34px -4px var(--c);
}
.orb.running .core { animation: breathe-core 3.2s ease-in-out infinite; }
.orb .ring { position: absolute; inset: 6px; border-radius: 50%; border: 2px solid var(--c); opacity: 0; }
.orb.tick .ring { animation: ripple 1.1s ease-out; }
.orb .tag {
  position: absolute; top: 96px; left: 50%; transform: translateX(-50%); white-space: nowrap;
  text-align: center; font-size: 13px; line-height: 1.25;
}
.orb .tag b { display: block; font: 800 14px/1.2 var(--display); }
.orb .tag span { color: var(--paper-dim); }
.orb.live .tag { top: 26px; left: 104px; transform: none; text-align: left; }
.orb.waiting { width: 56px; height: 56px; margin: -28px 0 0 -28px; }
.orb.waiting .core { inset: 10px; opacity: .8; box-shadow: 0 0 18px -6px var(--c); }
.orb.waiting .tag { top: 58px; }
.orb.waiting .bob { position: absolute; inset: 0; animation: bob 5s ease-in-out infinite; }
.orb.gone { width: 30px; height: 30px; margin: -15px 0 0 -15px; }
.orb.gone .core { inset: 6px; box-shadow: none; }
.orb.gone .tag { top: 30px; font-size: 12px; max-width: 96px; overflow: hidden; text-overflow: ellipsis; }
.orb.gone .tag b { font: 500 12px/1.2 var(--body); }
.orb .glyph { position: absolute; inset: 0; display: grid; place-items: center;
  font: 800 13px/1 var(--display); color: var(--night-deep); }

.legend { position: absolute; left: 50%; top: 20px; transform: translateX(-50%); display: flex; gap: 16px;
  font-size: 13px; color: var(--paper-dim); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
  background: var(--c); margin-right: 6px; vertical-align: -1px; }
.empty-stage { position: absolute; left: 50%; top: 42%; transform: translate(-50%,-50%);
  color: var(--paper-faint); font: 500 18px/1.3 var(--display); text-align: center; max-width: 360px; }

/* lower grid */
.grid { display: grid; grid-template-columns: 1.25fr 1fr; gap: 22px; margin-top: 26px; }
.grid > section { background: var(--panel); border: 1px solid var(--rule); border-radius: 18px; padding: 20px 22px; }
.grid .wide { grid-column: 1 / -1; }
h2 { font: 800 20px/1.2 var(--display); margin: 0 0 14px; letter-spacing: -0.01em; }
h2 small { font: 400 14px var(--body); color: var(--paper-faint); margin-left: 8px; letter-spacing: 0; }
.muted { color: var(--paper-faint); }

.agent { display: grid; grid-template-columns: 4px 1fr auto; gap: 4px 14px; padding: 12px 0;
  border-top: 1px solid var(--rule); }
.agent:first-of-type { border-top: 0; }
.agent .bar { grid-row: 1 / 4; border-radius: 2px; background: var(--c); }
.agent .who { font: 800 16px/1.3 var(--display); }
.agent .who em { font: 400 14px var(--body); font-style: normal; color: var(--c); margin-left: 8px; }
.agent .state { font-size: 14px; text-align: right; color: var(--paper-dim); }
.agent .what { grid-column: 2 / 4; }
.agent .meta { grid-column: 2 / 4; font-size: 13px; color: var(--paper-faint); }
.agent .meta span + span::before { content: ""; display: inline-block; width: 4px; height: 4px;
  border-radius: 50%; background: var(--paper-faint); margin: 0 8px; vertical-align: 3px; }

.project + .project { margin-top: 18px; }
.project h3 { font: 800 16px/1.2 var(--display); margin: 0 0 10px; }
.lanes3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.col h4 { font: 500 14px/1.2 var(--body); color: var(--paper-dim); margin: 0 0 8px; }
.col h4 b { color: var(--paper); }
.item { background: #2E2B50; border-radius: 10px; padding: 9px 11px; margin-bottom: 8px;
  border-left: 3px solid var(--s); font-size: 14px; line-height: 1.35; }
.item .n { font-weight: 700; display: block; }
.item .st { font-size: 12px; color: var(--s); }
.item .h { color: var(--paper-dim); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden; margin-top: 2px; }

.timeline { display: flex; align-items: flex-end; gap: 5px; height: 96px; padding-top: 8px;
  border-bottom: 1px solid var(--rule); overflow-x: auto; }
.tl { flex: 0 0 16px; border-radius: 5px 5px 2px 2px; background: var(--c); min-height: 10px;
  position: relative; opacity: .9; }
.tl.failed, .tl.rejected, .tl.interrupted { background: repeating-linear-gradient(45deg, var(--bad) 0 4px, #7A3440 4px 8px); }
.tl.cancelled { background: #4A4675; }
.tl:hover, .tl:focus-visible { opacity: 1; outline: 2px solid var(--paper); outline-offset: 1px; }
.tl-caption { display: flex; justify-content: space-between; font-size: 12px; color: var(--paper-faint); margin-top: 6px; }
.recent { list-style: none; margin: 14px 0 0; padding: 0; columns: 2 320px; column-gap: 28px; }
.recent li { break-inside: avoid; display: grid; grid-template-columns: 18px 1fr auto; gap: 8px;
  padding: 6px 0; font-size: 14px; border-top: 1px solid var(--rule); }
.recent .g { font-weight: 800; }
.recent .g.completed { color: var(--good); } .recent .g.failed, .recent .g.rejected, .recent .g.interrupted { color: var(--bad); }
.recent .g.cancelled { color: var(--paper-faint); } .recent .g.live { color: var(--wait); }
.recent .t { color: var(--paper-faint); font-size: 13px; }
.recent .why { grid-column: 2 / 4; color: var(--bad); font-size: 13px; }

.foot { margin-top: 22px; display: flex; gap: 22px; flex-wrap: wrap; font-size: 13px; color: var(--paper-faint); }
.svc { display: inline-flex; align-items: center; gap: 6px; }
.svc i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.svc.down i { background: var(--bad); } .svc.down { color: #FFD9D3; }

@keyframes breathe { 0%,100% { box-shadow: 0 0 0 0 color-mix(in oklab, currentColor 0%, transparent); transform: scale(1); } 50% { transform: scale(1.25); } }
@keyframes breathe-core { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
@keyframes ripple { 0% { opacity: .9; transform: scale(.8); } 100% { opacity: 0; transform: scale(1.6); } }
@keyframes bob { 0%,100% { transform: translateY(-5px); } 50% { transform: translateY(5px); } }

@media (max-width: 860px) {
  .page { padding: 18px 16px 36px; }
  .mark { font-size: 36px; }
  .stage { height: 520px; }
  .grid { grid-template-columns: 1fr; }
  .lanes3 { grid-template-columns: 1fr; }
  .legend { display: none; }
  .orb.live .tag { top: -40px; left: 50%; transform: translateX(-50%); text-align: center; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="page">
  <header class="mast">
    <h1 class="mark">C<span class="o">o</span>intOS</h1>
    <p class="summary" id="summary"><span class="pulse"></span>Connecting…</p>
    <span class="stamp" id="stamp"></span>
  </header>
  <div class="alert" id="alert" role="alert"></div>

  <div class="stage" id="stage" aria-label="Scheduler: models, their lanes, and the agents in them">
    <div class="zone-label waiting">Waiting for a lane</div>
    <div class="zone-label void">Back into the void</div>
    <div class="wells" id="wells"></div>
    <div id="orbs"></div>
    <div class="legend" id="legend"></div>
  </div>

  <div class="grid">
    <section aria-labelledby="h-agents">
      <h2 id="h-agents">Agents <small id="agent-count"></small></h2>
      <div id="agents"></div>
    </section>
    <section aria-labelledby="h-queues">
      <h2 id="h-queues">Queues <small>what agents will pick up next</small></h2>
      <div id="queues"></div>
    </section>
    <section class="wide" aria-labelledby="h-recent">
      <h2 id="h-recent">Recently <small>each bar is a job; height is how long it ran</small></h2>
      <div class="timeline" id="timeline"></div>
      <div class="tl-caption"><span id="tl-start"></span><span>now</span></div>
      <ul class="recent" id="recent"></ul>
    </section>
  </div>
  <footer class="foot" id="foot"></footer>
</div>

<script>
const ROLE = { worker: "--worker", manager: "--manager", steward: "--steward",
               sole_survivor: "--survivor", coin: "--coin" };
const ACTIVE = new Set(["running","runner_starting","claimed","ready","queued","awaiting_verification"]);
const LIVE = new Set(["running","runner_starting","claimed","awaiting_verification"]);
const GLYPH = { completed: "✓", failed: "✕", rejected: "✕", interrupted: "!", cancelled: "–" };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const colour = (role) => `var(${ROLE[role] || "--other"})`;
const short = (m) => (m || "").replace(/-GGUF$/, "");
const lastTicks = new Map();

function ago(iso, now) {
  if (!iso) return "—";
  let s = Math.max(0, Math.round((now - new Date(iso)) / 1000));
  if (s < 60) return `${s}s`;
  if (s < 3600) return `${Math.floor(s/60)}m`;
  if (s < 86400) return `${Math.floor(s/3600)}h ${Math.floor(s%3600/60)}m`;
  return `${Math.floor(s/86400)}d`;
}
function dur(sec) {
  if (sec == null) return "—";
  sec = Math.round(sec);
  if (sec < 60) return `${sec}s`;
  if (sec < 3600) return `${Math.floor(sec/60)}m ${sec%60}s`;
  return `${Math.floor(sec/3600)}h ${Math.floor(sec%3600/60)}m`;
}
function stateWords(state) {
  return { running: "working", runner_starting: "starting", claimed: "claimed", ready: "ready",
           queued: "waiting", awaiting_verification: "being checked" }[state] || state;
}

function summary(s) {
  const h = s.health, live = s.agents.filter(a => LIVE.has(a.state)).length;
  const waiting = s.agents.length - live;
  let dot = "", lead;
  if (h.incident || (h.resource_mode && h.resource_mode !== "normal")) { dot = "bad"; lead = `<b>Incident.</b> Resources are ${esc(h.resource_mode)}.`; }
  else if (h.paused) { dot = "warn"; lead = "<b>Paused.</b> Nothing new will start."; }
  else if (h.work_gate !== "open") { dot = "warn"; lead = `<b>Holding.</b> The work gate is ${esc(h.work_gate)}.`; }
  else lead = "<b>Healthy.</b>";
  const who = live ? `${live} agent${live>1?"s":""} working` : "No one working right now";
  const wait = waiting ? `, ${waiting} waiting` : "";
  $("summary").innerHTML = `<span class="pulse ${dot}"></span>${lead} ${who}${wait}.`;
}

function layout(s) {
  const occupied = new Set(s.agents.filter(a => LIVE.has(a.state) && a.model).map(a => a.model));
  const stage = $("stage"), W = stage.clientWidth, H = stage.clientHeight;
  const models = s.health.models;
  const narrow = W < 700;
  const wellsLeft = narrow ? 30 : 250, wellsRight = narrow ? 30 : 250;
  const span = Math.max(160, W - wellsLeft - wellsRight);
  const slotPos = {}, wellEls = [];
  models.forEach((m, i) => {
    const lanes = m.lanes || 1;
    const x = wellsLeft + span * (i + 0.5) / models.length;
    const height = lanes * 92 + (lanes - 1) * 14 + 44;
    const bottom = 64;
    const busy = m.busy || occupied.has(m.model);
    wellEls.push(`<div class="well ${m.pinned ? "control" : ""} ${busy ? "busy" : ""}" style="left:${x - 75}px;height:${height}px">
      ${Array.from({length: lanes}, () => `<div class="slot"></div>`).join("")}
      <div class="well-name"><strong>${esc(short(m.model))}</strong>
        <span>${lanes} lane${lanes>1?"s":""}${m.pinned ? " · pinned · front desk" : busy ? " · working" : " · idle"}</span></div></div>`);
    slotPos[m.model] = Array.from({length: lanes}, (_, k) =>
      [x, H - bottom - 22 - 46 - k * (92 + 14)]);
  });
  $("wells").innerHTML = wellEls.join("");
  return { slotPos, W, H, narrow };
}

function place(s, geo) {
  const now = new Date(s.now);
  const targets = new Map();
  const used = {};
  const live = s.agents.filter(a => LIVE.has(a.state) && a.model);
  const waiting = s.agents.filter(a => !(LIVE.has(a.state) && a.model));
  live.forEach(a => {
    const slots = geo.slotPos[a.model] || [];
    const k = used[a.model] = (used[a.model] ?? -1) + 1;
    const pos = slots[k] || [geo.W / 2, geo.H / 2];
    targets.set(a.id, { a, kind: "live", x: pos[0], y: pos[1] });
  });
  waiting.forEach((a, i) => {
    const x = geo.narrow ? 60 + (i % 4) * 70 : 70 + (i % 2) * 90;
    const y = geo.narrow ? 70 : 100 + Math.floor(i / 2) * 96;
    targets.set(a.id, { a, kind: "waiting", x, y });
  });
  const recentGone = s.jobs.filter(j => !ACTIVE.has(j.state)
      && (now - new Date(j.updated_at)) < 45 * 60 * 1000).slice(0, 8);
  recentGone.forEach((j, i) => {
    const x = geo.W - (geo.narrow ? 50 : 70) - (i % 2) * 110;
    const y = 72 + Math.floor(i / 2) * 64;
    targets.set(j.id, { a: j, kind: "gone", x, y, fade: Math.max(.35, 1 - (now - new Date(j.updated_at)) / (45*60*1000)) });
  });

  const layer = $("orbs");
  const existing = new Map([...layer.children].map(el => [el.dataset.id, el]));
  targets.forEach((t, id) => {
    let el = existing.get(id);
    const a = t.a;
    if (!el) {
      el = document.createElement("div");
      el.dataset.id = id;
      el.innerHTML = `<div class="bob"><div class="ring"></div><div class="core"></div><div class="glyph"></div></div><div class="tag"></div>`;
      // new agents emerge from the void; new waiters drift in from the left edge
      el.style.transform = t.kind === "waiting" ? `translate(-60px, ${t.y}px)` : `translate(${geo.W - 40}px, -40px)`;
      el.style.opacity = "0";
      layer.appendChild(el);
      requestAnimationFrame(() => requestAnimationFrame(() => move(el, t)));
    } else move(el, t);
    el.className = `orb ${t.kind} ${a.state === "running" ? "running" : ""}`;
    el.style.setProperty("--c", colour(a.role));
    el.querySelector(".glyph").textContent = t.kind === "gone" ? (GLYPH[a.state] || "") : "";
    el.querySelector(".tag").innerHTML = t.kind === "live"
      ? `<b>${esc(a.name)}</b><span>${esc(a.role)} · ${a.tool_calls} calls</span>`
      : t.kind === "waiting" ? `<b>${esc(a.name)}</b><span>${esc(a.role)}</span>`
      : `<b>${esc(a.name)}</b>`;
    el.title = `${a.name} (${a.role}) — ${a.what}`;
    const prev = lastTicks.get(id);
    if (t.kind === "live" && prev != null && a.tool_calls > prev) {
      el.classList.remove("tick"); void el.offsetWidth; el.classList.add("tick");
    }
    lastTicks.set(id, a.tool_calls);
  });
  existing.forEach((el, id) => {
    if (!targets.has(id)) {
      el.style.opacity = "0";
      el.style.transform += " translateY(-80px)";
      setTimeout(() => el.remove(), 1500);
    }
  });
  const empty = !live.length && !waiting.length;
  let note = $("stage").querySelector(".empty-stage");
  if (empty && !note) { note = document.createElement("div"); note.className = "empty-stage";
    note.textContent = "All quiet. The spawner will send someone in when there’s spare capacity."; $("stage").appendChild(note); }
  if (!empty && note) note.remove();
}
function move(el, t) {
  el.style.transform = `translate(${t.x}px, ${t.y}px)`;
  el.style.opacity = t.kind === "gone" ? String(t.fade) : "1";
}

function legend() {
  $("legend").innerHTML = [["worker","Worker"],["manager","Manager"],["steward","Steward"],["sole_survivor","Sole Survivor"]]
    .map(([r, n]) => `<span><i style="--c:${colour(r)}"></i>${n}</span>`).join("");
}

function agentsPanel(s) {
  const now = new Date(s.now);
  $("agent-count").textContent = s.agents.length ? `${s.agents.length} alive` : "";
  if (!s.agents.length) { $("agents").innerHTML = `<p class="muted">Nobody’s alive right now.</p>`; return; }
  $("agents").innerHTML = s.agents.map(a => {
    const meta = [a.origin.replace("auto·", "spawned for "), a.workspace, short(a.model)].filter(Boolean);
    if (a.state === "running") meta.push(`${a.tool_calls} tool calls`, `last output ${ago(a.last_activity, now)} ago`);
    const waitWhy = a.state === "queued" && a.outcome && !a.outcome.startsWith("Pending")
      ? `<div class="meta" style="color:var(--wait)">waiting: ${esc(a.outcome)}</div>` : "";
    return `<div class="agent" style="--c:${colour(a.role)}">
      <div class="bar"></div>
      <div class="who">${esc(a.name)}<em>${esc(a.role)}</em></div>
      <div class="state">${esc(stateWords(a.state))} for ${dur(a.age_seconds)}</div>
      <div class="what">${esc(a.what)}</div>
      <div class="meta">${meta.map(m => `<span>${esc(m)}</span>`).join("")}</div>${waitWhy}
    </div>`;
  }).join("");
}

function queuesPanel(s) {
  const tint = { queued: "var(--wait)", "in progress": "var(--manager)", done: "var(--good)",
                 blocked: "var(--bad)", drafted: "var(--steward)" };
  const projects = [...new Set(s.queues.map(q => q.project))];
  if (!projects.length) { $("queues").innerHTML = `<p class="muted">Queues are empty. Draft an idea through Coin, or wait for the next project survey.</p>`; return; }
  $("queues").innerHTML = projects.map(p => {
    const cols = ["urgent","queued","drafted"].map(b => {
      const items = s.queues.filter(q => q.project === p && q.branch === b);
      return `<div class="col"><h4><b>${b[0].toUpperCase()+b.slice(1)}</b> ${items.length}</h4>${
        items.map(q => `<div class="item" style="--s:${tint[q.status] || "var(--paper-faint)"}">
          <span class="n">${esc(q.name)}</span><span class="st">${esc(q.status)}</span>
          <span class="h">${esc(q.headline)}</span></div>`).join("")}</div>`;
    }).join("");
    return `<div class="project"><h3>${esc(p)}</h3><div class="lanes3">${cols}</div></div>`;
  }).join("");
}

function recentPanel(s) {
  const now = new Date(s.now);
  const jobs = [...s.jobs].reverse();
  const longest = Math.max(60, ...jobs.map(j => j.age_seconds || 0));
  $("timeline").innerHTML = jobs.map(j => {
    const h = 10 + 76 * Math.sqrt((j.age_seconds || 0) / longest);
    return `<div class="tl ${esc(j.state)}" tabindex="0" style="height:${h}px;--c:${ACTIVE.has(j.state) ? "var(--wait)" : colour(j.role)}"
      title="${esc(j.name)} · ${esc(j.state)} · ${dur(j.age_seconds)} — ${esc(j.what)}"></div>`;
  }).join("");
  $("tl-start").textContent = jobs.length ? `${ago(jobs[0].created_at, now)} ago` : "";
  $("recent").innerHTML = s.jobs.slice(0, 12).map(j => {
    const live = ACTIVE.has(j.state);
    const bad = ["failed","rejected","interrupted"].includes(j.state) && j.outcome;
    return `<li><span class="g ${live ? "live" : esc(j.state)}">${live ? "•" : (GLYPH[j.state] || "·")}</span>
      <span>${esc(j.name)} <span class="t">${esc(j.what)}</span></span>
      <span class="t">${live ? stateWords(j.state) : ago(j.updated_at, now) + " ago"}</span>
      ${bad ? `<span class="why">${esc(j.outcome)}</span>` : ""}</li>`;
  }).join("") || `<li class="muted">No jobs yet.</li>`;
}

function footer(s) {
  const sp = s.spawner, now = new Date(s.now);
  const spawn = sp.enabled
    ? `Spawner on, up to ${sp.max_active} agents${sp.last_spawn_at ? `, last sent a ${esc(sp.last_kind)} ${ago(sp.last_spawn_at, now)} ago` : ""}`
    : "Spawner off";
  const svcs = s.services.map(v => `<span class="svc ${v.state === "active" ? "" : "down"}"><i></i>${esc(v.unit.replace(/^agent-/, "").replace(/\.service$/, ""))}</span>`).join("");
  $("foot").innerHTML = `<span>${spawn}</span>${svcs}`;
}

let last = null;
async function refresh() {
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    const s = await r.json();
    if (s.error) throw new Error(s.error);
    last = s;
    $("alert").classList.remove("show");
    summary(s); place(s, layout(s)); agentsPanel(s); queuesPanel(s); recentPanel(s); footer(s);
    $("stamp").textContent = `updated ${new Date(s.now).toLocaleTimeString()}`;
  } catch (e) {
    $("alert").textContent = `Can’t read CointOS state: ${e.message}. Check that agent-dashboard is running (cointos status).`;
    $("alert").classList.add("show");
  }
}
legend();
refresh();
setInterval(refresh, 2000);
addEventListener("resize", () => last && place(last, layout(last)));
</script>
</body>
