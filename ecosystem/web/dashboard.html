<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CointOS</title>
<style>
/* Styling follows David's site (~/Projects/Website/style.css): blush paper, ink,
   rose accent, square corners, hard offset shadows, heavy tight system sans. */
:root {
  color-scheme: light;
  --bg: #fff9f5;
  --paper: #fffdfb;
  --ink: #28262b;
  --ink-soft: #5d565b;
  --ink-faint: #766d71;
  --accent: #9f3b52;
  --accent-bright: #e9687e;
  --accent-wash: #f9eae6;
  --line: #9a858a;
  --line-soft: #e5d9d7;
  --shadow: #e9d9d6;
  --dark: #29272c;
  --dark-2: #343137;
  --dark-line: #4a4549;
  --dark-text: #fff5ef;
  --dark-soft: #cfc3bf;
  --pink-shadow: #e8b7b8;
  --worker: #ecc16b;
  --manager: #79cda5;
  --steward: #c99a7a;
  --survivor: #e9687e;
  --coin: #ffb1b5;
  --other: #cfc3bf;
  --good: #3f8f6a;
  --bad: #9f3b52;
  --wait: #b7862a;
  font-family: ui-sans-serif, system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; color: var(--ink); font-size: 15px; line-height: 1.5; font-variant-numeric: tabular-nums;
  background: radial-gradient(circle at 88% 5%, #ffd8d8, transparent 25%), var(--bg); min-height: 100vh; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
main { max-width: 1260px; margin: auto; padding: 26px 24px 60px; }

.topline { display: flex; justify-content: space-between; gap: 16px; align-items: baseline;
  border-bottom: 2px solid var(--dark); padding-bottom: 14px; }
.mark { margin: 0; font-size: clamp(40px, 5vw, 64px); line-height: .92; letter-spacing: -.07em; font-weight: 900; }
.mark em { font-style: normal; color: var(--accent-bright); }
.stamp { color: var(--ink-faint); font-size: 13px; }
.summary { margin: 16px 0 0; font-size: clamp(17px, 2vw, 22px); line-height: 1.35; color: var(--ink-soft); max-width: 860px; }
.summary b { color: var(--ink); font-weight: 900; }
.dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 10px;
  background: var(--manager); border: 2px solid var(--dark); vertical-align: 1px; }
.dot.warn { background: var(--worker); } .dot.bad { background: var(--accent-bright); }
.alert { display: none; margin-top: 18px; padding: 13px 18px; border-left: 5px solid var(--accent-bright);
  background: var(--accent-wash); color: #4f454a; }
.alert.show { display: block; }

/* the stage: a dark panel with the site's pink offset shadow */
.stage { position: relative; margin-top: 26px; height: 440px; background: var(--dark); color: var(--dark-text);
  border: 2px solid var(--dark); box-shadow: 7px 7px 0 var(--pink-shadow); overflow: hidden; }
.zone { position: absolute; top: 16px; font-size: 13px; font-weight: 800; color: var(--dark-soft); }
.zone.waiting { left: 20px; } .zone.void { right: 20px; }
.legend { position: absolute; left: 50%; top: 16px; transform: translateX(-50%); display: flex; gap: 16px;
  font-size: 13px; color: var(--dark-soft); white-space: nowrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--c); margin-right: 6px; vertical-align: -1px; }
.well { position: absolute; bottom: 64px; width: 150px; border-radius: 75px; background: var(--dark-2);
  border: 1px solid var(--dark-line); display: flex; flex-direction: column-reverse; align-items: center;
  gap: 14px; padding: 22px 0; }
.well.busy { border-color: #6d6368; }
.slot { width: 92px; height: 92px; border-radius: 50%; border: 1.5px dashed #5b5358; }
.well-name { position: absolute; bottom: -50px; left: 50%; transform: translateX(-50%); width: 230px; text-align: center; }
.well-name strong { display: block; font-size: 16px; font-weight: 900; letter-spacing: -.03em; }
.well-name span { font-size: 13px; color: var(--dark-soft); }

.orb { position: absolute; left: 0; top: 0; width: 92px; height: 92px; margin: -46px 0 0 -46px;
  transition: transform 1.4s cubic-bezier(.22,.8,.2,1), opacity 1.4s ease; will-change: transform; }
.orb .core { position: absolute; inset: 16px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff9 0%, var(--c) 40%, color-mix(in oklab, var(--c) 60%, #000) 100%);
  box-shadow: 0 0 30px -6px var(--c); }
.orb.running .core { animation: breathe 3.2s ease-in-out infinite; }
.orb .ring { position: absolute; inset: 6px; border-radius: 50%; border: 2px solid var(--c); opacity: 0; }
.orb.tick .ring { animation: ripple 1.1s ease-out; }
.orb .tag { position: absolute; top: 96px; left: 50%; transform: translateX(-50%); white-space: nowrap;
  text-align: center; font-size: 13px; line-height: 1.25; }
.orb .tag b { display: block; font-size: 14px; font-weight: 900; letter-spacing: -.02em; }
.orb .tag span { color: var(--dark-soft); }
.orb.live .tag { top: 26px; left: 104px; transform: none; text-align: left; }
.orb.waiting { width: 56px; height: 56px; margin: -28px 0 0 -28px; }
.orb.waiting .core { inset: 10px; opacity: .85; box-shadow: none; }
.orb.waiting .tag { top: 58px; }
.orb.waiting .bob { position: absolute; inset: 0; animation: bob 5s ease-in-out infinite; }
.orb.gone { width: 30px; height: 30px; margin: -15px 0 0 -15px; }
.orb.gone .core { inset: 6px; box-shadow: none; }
.orb.gone .tag { top: 30px; font-size: 12px; max-width: 100px; overflow: hidden; text-overflow: ellipsis; }
.orb.gone .tag b { font-weight: 500; font-size: 12px; color: var(--dark-soft); }
.orb .glyph { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 900; font-size: 13px; color: var(--dark); }
.orb.coin .core { background: radial-gradient(circle at 35% 30%, #fff 0%, var(--coin) 45%, #c9737a 100%); }
.empty { position: absolute; left: 50%; top: 42%; transform: translate(-50%,-50%); color: var(--dark-soft);
  font-size: 18px; font-weight: 800; letter-spacing: -.02em; text-align: center; max-width: 380px; }

/* panels: the site's card */
.grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; margin-top: 34px; }
.panel { border: 1px solid var(--line); background: var(--paper); box-shadow: 4px 4px 0 var(--shadow); padding: 20px 22px; min-width: 0; }
.panel.wide { grid-column: 1 / -1; }
h2 { font-size: clamp(24px, 2.6vw, 32px); line-height: 1; letter-spacing: -.055em; margin: 0 0 6px; font-weight: 900; }
.note { color: var(--ink-faint); font-size: 14px; margin: 0 0 14px; }
.muted { color: var(--ink-faint); }

.agent { display: grid; grid-template-columns: 5px 1fr auto; gap: 3px 14px; padding: 12px 0; border-top: 1px solid var(--line-soft); }
.agent:first-child { border-top: 0; padding-top: 4px; }
.agent .bar { grid-row: 1 / 4; background: var(--c); border: 1px solid var(--dark); }
.agent .who { font-weight: 900; letter-spacing: -.02em; font-size: 16px; }
.agent .who em { font-style: normal; font-weight: 700; font-size: 14px; color: var(--ink-soft); margin-left: 8px; }
.agent .state { font-size: 14px; color: var(--ink-soft); text-align: right; }
.agent .what, .agent .meta { grid-column: 2 / 4; }
.agent .meta { font-size: 13px; color: var(--ink-faint); }
.agent .meta span + span::before { content: "/"; margin: 0 7px; color: var(--line); }
.agent .waitwhy { grid-column: 2 / 4; font-size: 13px; color: var(--wait); }

.turn { padding: 10px 0; border-top: 1px solid var(--line-soft); }
.turn:first-child { border-top: 0; padding-top: 4px; }
.turn .you { font-weight: 800; }
.turn .you small { font-weight: 400; color: var(--ink-faint); margin-left: 8px; }
.turn .re { color: var(--ink-soft); font-size: 14px; margin-top: 2px; }
.pill { display: inline-block; padding: 1px 8px; border: 1px solid #776c71; font-size: 12px; font-weight: 800; margin-left: 8px; background: var(--paper); }
.pill.thinking { background: var(--coin); } .pill.replied { background: #d9f0e4; } .pill.failed { background: var(--accent-wash); color: var(--accent); }

.project + .project { margin-top: 18px; }
.project h3 { font-size: 18px; letter-spacing: -.03em; margin: 0 0 10px; font-weight: 900; }
.cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.col h4 { margin: 0 0 8px; font-size: 14px; font-weight: 800; }
.col h4 span { color: var(--ink-faint); font-weight: 400; margin-left: 4px; }
.item { border: 1px solid var(--line); background: var(--bg); padding: 9px 11px; margin-bottom: 8px; font-size: 14px; line-height: 1.35;
  box-shadow: 3px 3px 0 var(--s, var(--shadow)); }
.item .n { font-weight: 800; display: block; }
.item .h { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--ink-soft); font-size: 13px; margin-top: 3px; }
.item .st { display: inline-block; margin-top: 5px; padding: 0 6px; border: 1px solid #776c71; font-size: 11px; font-weight: 800; background: var(--s, var(--paper)); }

.timeline { display: flex; align-items: flex-end; gap: 5px; height: 96px; border-bottom: 2px solid var(--dark); overflow-x: auto; }
.tl { flex: 0 0 16px; min-height: 10px; background: var(--c); border: 1px solid var(--dark); border-bottom: 0; }
.tl.failed, .tl.rejected, .tl.interrupted { background: repeating-linear-gradient(45deg, var(--accent-bright) 0 4px, var(--accent) 4px 8px); }
.tl.cancelled { background: var(--line-soft); }
.tl-caption { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-faint); margin-top: 6px; }
.recent { list-style: none; margin: 14px 0 0; padding: 0; columns: 2 320px; column-gap: 28px; }
.recent li { break-inside: avoid; display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; padding: 6px 0; font-size: 14px; border-top: 1px solid var(--line-soft); }
.recent .g { font-weight: 900; }
.recent .g.completed { color: var(--good); } .recent .g.failed, .recent .g.rejected, .recent .g.interrupted { color: var(--bad); }
.recent .g.cancelled { color: var(--ink-faint); } .recent .g.live { color: var(--wait); }
.recent .t { color: var(--ink-faint); font-size: 13px; }
.recent .why { grid-column: 2 / 4; color: var(--bad); font-size: 13px; }

footer { border-top: 2px solid var(--dark); margin-top: 40px; padding-top: 14px; color: #71686c; font-size: 13px;
  display: flex; gap: 8px 20px; flex-wrap: wrap; }
.svc::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--manager);
  border: 1px solid var(--dark); margin-right: 6px; vertical-align: 0; }
.svc.down { color: var(--accent); font-weight: 800; } .svc.down::before { background: var(--accent-bright); }

@keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
@keyframes ripple { 0% { opacity: .9; transform: scale(.8); } 100% { opacity: 0; transform: scale(1.6); } }
@keyframes bob { 0%,100% { transform: translateY(-5px); } 50% { transform: translateY(5px); } }

@media (max-width: 860px) {
  main { padding: 19px 14px 40px; }
  .stage { height: 520px; box-shadow: 5px 5px 0 var(--pink-shadow); }
  .grid, .cols { grid-template-columns: 1fr; }
  .legend { display: none; }
  .orb.live .tag { top: -40px; left: 50%; transform: translateX(-50%); text-align: center; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main>
  <header>
    <div class="topline">
      <h1 class="mark">Coint<em>OS</em></h1>
      <span class="stamp" id="stamp"></span>
    </div>
    <p class="summary" id="summary"><span class="dot"></span>Connecting…</p>
    <div class="alert" id="alert" role="alert"></div>
  </header>

  <div class="stage" id="stage" aria-label="Scheduler: models, their lanes, and the agents in them">
    <div class="zone waiting">Waiting for a lane</div>
    <div class="legend" id="legend"></div>
    <div class="zone void">Back into the void</div>
    <div id="wells"></div>
    <div id="orbs"></div>
  </div>

  <div class="grid">
    <section class="panel" aria-labelledby="h-agents">
      <h2 id="h-agents">Agents</h2>
      <p class="note" id="agent-note"></p>
      <div id="agents"></div>
    </section>
    <section class="panel" aria-labelledby="h-coin">
      <h2 id="h-coin">Coin</h2>
      <p class="note" id="coin-note">Your recent messages and what Coin did with them.</p>
      <div id="coin"></div>
    </section>
    <section class="panel wide" aria-labelledby="h-queues">
      <h2 id="h-queues">Queues</h2>
      <p class="note">What agents will pick up next, read from each project’s knowledge tree.</p>
      <div id="queues"></div>
    </section>
    <section class="panel wide" aria-labelledby="h-recent">
      <h2 id="h-recent">Recently</h2>
      <p class="note">Each bar is a job; its height is how long it ran.</p>
      <div class="timeline" id="timeline"></div>
      <div class="tl-caption"><span id="tl-start"></span><span>now</span></div>
      <ul class="recent" id="recent"></ul>
    </section>
  </div>
  <footer id="foot"></footer>
</main>

<script>
const ROLE = { worker: "--worker", manager: "--manager", steward: "--steward", sole_survivor: "--survivor", coin: "--coin" };
const ACTIVE = new Set(["running","runner_starting","claimed","ready","queued","awaiting_verification"]);
const LIVE = new Set(["running","runner_starting","claimed","awaiting_verification"]);
const GLYPH = { completed: "✓", failed: "✕", rejected: "✕", interrupted: "!", cancelled: "–" };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const colour = (role) => `var(${ROLE[role] || "--other"})`;
const short = (m) => (m || "").replace(/-GGUF$/, "");
const lastTicks = new Map();

function ago(iso, now) {
  if (!iso) return "—";
  const s = Math.max(0, Math.round((now - new Date(iso)) / 1000));
  if (s < 60) return `${s}s`;
  if (s < 3600) return `${Math.floor(s/60)}m`;
  if (s < 86400) return `${Math.floor(s/3600)}h ${Math.floor(s%3600/60)}m`;
  return `${Math.floor(s/86400)}d`;
}
function dur(sec) {
  if (sec == null) return "—";
  sec = Math.round(sec);
  if (sec < 60) return `${sec}s`;
  if (sec < 3600) return `${Math.floor(sec/60)}m ${sec%60}s`;
  return `${Math.floor(sec/3600)}h ${Math.floor(sec%3600/60)}m`;
}
const words = (st) => ({ running: "working", runner_starting: "starting", claimed: "claimed", ready: "ready",
  queued: "waiting", awaiting_verification: "being checked" }[st] || st);

function summary(s) {
  const h = s.health, live = s.agents.filter(a => LIVE.has(a.state)).length, waiting = s.agents.length - live;
  const coinBusy = s.coin.active.length;
  let dot = "", lead;
  if (h.incident || (h.resource_mode && h.resource_mode !== "normal")) { dot = "bad"; lead = `<b>Incident.</b> Resources are ${esc(h.resource_mode)}.`; }
  else if (h.paused) { dot = "warn"; lead = "<b>Paused.</b> Nothing new will start."; }
  else if (h.work_gate !== "open") { dot = "warn"; lead = `<b>Holding.</b> The work gate is ${esc(h.work_gate)}.`; }
  else lead = "<b>Healthy.</b>";
  const parts = [live ? `${live} agent${live>1?"s":""} working` : "no agents working"];
  if (waiting) parts.push(`${waiting} waiting`);
  if (coinBusy) parts.push("Coin is thinking");
  $("summary").innerHTML = `<span class="dot ${dot}"></span>${lead} ${parts.join(", ").replace(/^./, c => c.toUpperCase())}.`;
}

function layout(s) {
  const stage = $("stage"), W = stage.clientWidth, H = stage.clientHeight, narrow = W < 700;
  const occupied = new Set([...s.agents.filter(a => LIVE.has(a.state) && a.model).map(a => a.model),
                            ...s.coin.active.filter(c => c.placement === "live").map(c => c.model)]);
  const models = s.health.models, side = narrow ? 30 : 250;
  const span = Math.max(160, W - 2 * side), slotPos = {};
  $("wells").innerHTML = models.map((m, i) => {
    const lanes = m.lanes || 1, x = side + span * (i + .5) / models.length;
    const busy = m.busy || occupied.has(m.model);
    slotPos[m.model] = Array.from({length: lanes}, (_, k) => [x, H - 64 - 22 - 46 - k * 106]);
    return `<div class="well ${busy ? "busy" : ""}" style="left:${x - 75}px;height:${lanes * 106 + 30}px">
      ${"<div class='slot'></div>".repeat(lanes)}
      <div class="well-name"><strong>${esc(short(m.model))}</strong>
      <span>${lanes} lane${lanes>1?"s":""}${m.pinned ? " / pinned front desk" : busy ? " / working" : " / idle"}</span></div></div>`;
  }).join("");
  return { slotPos, W, H, narrow };
}

function place(s, geo) {
  const now = new Date(s.now), targets = new Map(), used = {};
  const put = (id, a, model) => {
    const k = used[model] = (used[model] ?? -1) + 1;
    const pos = (geo.slotPos[model] || [])[k];
    return pos ? { a, kind: "live", x: pos[0], y: pos[1] } : null;
  };
  const coinOrbs = s.coin.active.map(c => ({ id: c.id, name: "Coin", role: "coin", state: c.placement === "live" ? "running" : "queued",
    model: c.model, tool_calls: null, what: "answering your message", live: c.placement === "live" }));
  const waiting = [];
  [...coinOrbs.filter(c => c.live), ...s.agents.filter(a => LIVE.has(a.state) && a.model)].forEach(a => {
    const t = put(a.id, a, a.model);
    t ? targets.set(a.id, t) : waiting.push(a);
  });
  waiting.push(...coinOrbs.filter(c => !c.live), ...s.agents.filter(a => !(LIVE.has(a.state) && a.model)));
  waiting.forEach((a, i) => targets.set(a.id, { a, kind: "waiting",
    x: geo.narrow ? 60 + (i % 3) * 110 : 80 + (i % 2) * 130, y: geo.narrow ? 76 + Math.floor(i / 3) * 90 : 104 + Math.floor(i / 2) * 96 }));
  s.jobs.filter(j => !ACTIVE.has(j.state) && (now - new Date(j.updated_at)) < 45 * 60 * 1000).slice(0, 8)
    .forEach((j, i) => targets.set(j.id, { a: j, kind: "gone", x: geo.W - (geo.narrow ? 50 : 70) - (i % 2) * 110,
      y: 76 + Math.floor(i / 2) * 64, fade: Math.max(.35, 1 - (now - new Date(j.updated_at)) / (45 * 60 * 1000)) }));

  const layer = $("orbs"), existing = new Map([...layer.children].map(el => [el.dataset.id, el]));
  targets.forEach((t, id) => {
    const a = t.a;
    let el = existing.get(id);
    if (!el) {
      el = document.createElement("div");
      el.dataset.id = id;
      el.innerHTML = `<div class="bob"><div class="ring"></div><div class="core"></div><div class="glyph"></div></div><div class="tag"></div>`;
      el.style.transform = t.kind === "waiting" ? `translate(-60px, ${t.y}px)` : `translate(${geo.W - 40}px, -40px)`;
      el.style.opacity = "0";
      layer.appendChild(el);
      requestAnimationFrame(() => requestAnimationFrame(() => move(el, t)));
    } else move(el, t);
    el.className = `orb ${t.kind} ${a.state === "running" ? "running" : ""} ${a.role === "coin" ? "coin" : ""}`;
    el.style.setProperty("--c", colour(a.role));
    el.querySelector(".glyph").textContent = t.kind === "gone" ? (GLYPH[a.state] || "") : "";
    el.querySelector(".tag").innerHTML = t.kind === "live"
      ? `<b>${esc(a.name)}</b><span>${a.role === "coin" ? "answering you" : `${esc(a.role)} / ${a.tool_calls} calls`}</span>`
      : t.kind === "waiting" ? `<b>${esc(a.name)}</b><span>${a.role === "coin" ? "waiting for a lane" : esc(a.role)}</span>`
      : `<b>${esc(a.name)}</b>`;
    el.title = `${a.name} (${a.role}): ${a.what}`;
    const prev = lastTicks.get(id);
    if (t.kind === "live" && a.tool_calls != null && prev != null && a.tool_calls > prev) {
      el.classList.remove("tick"); void el.offsetWidth; el.classList.add("tick");
    }
    lastTicks.set(id, a.tool_calls);
  });
  existing.forEach((el, id) => {
    if (targets.has(id)) return;
    el.style.opacity = "0"; el.style.transform += " translateY(-80px)";
    setTimeout(() => el.remove(), 1500);
  });
  const empty = !s.agents.length && !s.coin.active.length;
  let note = $("stage").querySelector(".empty");
  if (empty && !note) { note = document.createElement("div"); note.className = "empty";
    note.textContent = "All quiet. The spawner will send someone in when there’s spare capacity."; $("stage").appendChild(note); }
  if (!empty && note) note.remove();
}
function move(el, t) {
  el.style.transform = `translate(${t.x}px, ${t.y}px)`;
  el.style.opacity = t.kind === "gone" ? String(t.fade) : "1";
}

function agentsPanel(s) {
  const now = new Date(s.now);
  $("agent-note").textContent = s.agents.length ? `${s.agents.length} alive right now.` : "Nobody’s alive right now.";
  $("agents").innerHTML = s.agents.map(a => {
    const meta = [a.origin.replace("auto·", "spawned for "), a.workspace, short(a.model)].filter(Boolean);
    if (a.state === "running") meta.push(`${a.tool_calls} tool calls`, `last output ${ago(a.last_activity, now)} ago`);
    const why = a.state === "queued" && a.outcome && !a.outcome.startsWith("Pending") ? `<div class="waitwhy">Waiting: ${esc(a.outcome)}</div>` : "";
    return `<div class="agent" style="--c:${colour(a.role)}"><div class="bar"></div>
      <div class="who">${esc(a.name)}<em>${esc(a.role)}</em></div>
      <div class="state">${esc(words(a.state))} for ${dur(a.age_seconds)}</div>
      <div class="what">${esc(a.what)}</div>
      <div class="meta">${meta.map(m => `<span>${esc(m)}</span>`).join("")}</div>${why}</div>`;
  }).join("");
}

function coinPanel(s) {
  const now = new Date(s.now);
  if (!s.coin.turns.length) { $("coin").innerHTML = `<p class="muted">No messages yet. Say hi to Coin on Telegram.</p>`; return; }
  $("coin").innerHTML = s.coin.turns.map(t => `<div class="turn">
    <div class="you">“${esc(t.message)}”<span class="pill ${esc(t.status)}">${esc(t.status)}</span><small>${ago(t.received_at, now)} ago</small></div>
    ${t.reply ? `<div class="re">${esc(t.reply)}${t.reply.length >= 140 ? "…" : ""}</div>` : ""}</div>`).join("");
}

function queuesPanel(s) {
  const tint = { queued: "#f6dfa6", "in progress": "#bfe6d1", done: "#d9f0e4", blocked: "#f5c3cb", drafted: "#ead7c9" };
  const projects = [...new Set(s.queues.map(q => q.project))];
  if (!projects.length) { $("queues").innerHTML = `<p class="muted">Queues are empty. Draft an idea through Coin, or wait for the next project survey.</p>`; return; }
  $("queues").innerHTML = projects.map(p => `<div class="project"><h3>${esc(p)}</h3><div class="cols">${
    ["urgent","queued","drafted"].map(b => {
      const items = s.queues.filter(q => q.project === p && q.branch === b);
      return `<div class="col"><h4>${b[0].toUpperCase() + b.slice(1)}<span>${items.length}</span></h4>${items.map(q =>
        `<div class="item" style="--s:${tint[q.status] || "var(--shadow)"}"><span class="n">${esc(q.name)}</span>
         <span class="h">${esc(q.headline)}</span><span class="st">${esc(q.status)}</span></div>`).join("")}</div>`;
    }).join("")}</div></div>`).join("");
}

function recentPanel(s) {
  const now = new Date(s.now), jobs = [...s.jobs].reverse();
  const longest = Math.max(60, ...jobs.map(j => j.age_seconds || 0));
  $("timeline").innerHTML = jobs.map(j => `<div class="tl ${esc(j.state)}" tabindex="0"
    style="height:${10 + 76 * Math.sqrt((j.age_seconds || 0) / longest)}px;--c:${ACTIVE.has(j.state) ? "var(--worker)" : colour(j.role)}"
    title="${esc(j.name)} / ${esc(j.state)} / ${dur(j.age_seconds)}: ${esc(j.what)}"></div>`).join("");
  $("tl-start").textContent = jobs.length ? `${ago(jobs[0].created_at, now)} ago` : "";
  $("recent").innerHTML = s.jobs.slice(0, 12).map(j => {
    const live = ACTIVE.has(j.state), bad = ["failed","rejected","interrupted"].includes(j.state) && j.outcome;
    return `<li><span class="g ${live ? "live" : esc(j.state)}">${live ? "•" : (GLYPH[j.state] || "·")}</span>
      <span>${esc(j.name)} <span class="t">${esc(j.what)}</span></span>
      <span class="t">${live ? words(j.state) : ago(j.updated_at, now) + " ago"}</span>
      ${bad ? `<span class="why">${esc(j.outcome)}</span>` : ""}</li>`;
  }).join("") || `<li class="muted">No jobs yet.</li>`;
}

function footer(s) {
  const sp = s.spawner, now = new Date(s.now);
  const spawn = sp.enabled ? `Spawner on, up to ${sp.max_active} agents${sp.last_spawn_at ? `, last sent a ${esc(sp.last_kind)} ${ago(sp.last_spawn_at, now)} ago` : ""}` : "Spawner off";
  $("foot").innerHTML = `<span>${spawn}</span>` + s.services.map(v =>
    `<span class="svc ${v.state === "active" ? "" : "down"}">${esc(v.unit.replace(/^agent-/, "").replace(/\.service$/, ""))}</span>`).join("");
}

let last = null;
async function refresh() {
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    const s = await r.json();
    if (s.error) throw new Error(s.error);
    last = s;
    $("alert").classList.remove("show");
    summary(s); place(s, layout(s)); agentsPanel(s); coinPanel(s); queuesPanel(s); recentPanel(s); footer(s);
    $("stamp").textContent = `Updated ${new Date(s.now).toLocaleTimeString()}`;
  } catch (e) {
    $("alert").textContent = `Can’t read CointOS state: ${e.message}. Check that agent-dashboard is running (cointos status).`;
    $("alert").classList.add("show");
  }
}
$("legend").innerHTML = [["worker","Worker"],["manager","Manager"],["steward","Steward"],["sole_survivor","Sole Survivor"],["coin","Coin"]]
  .map(([r, n]) => `<span><i style="--c:${colour(r)}"></i>${n}</span>`).join("");
refresh();
setInterval(refresh, 2000);
addEventListener("resize", () => last && place(last, layout(last)));
</script>
</body>
</html>
