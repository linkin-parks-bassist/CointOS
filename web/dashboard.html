<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CointOS</title>
<style>
/* Styled after David's site (~/Projects/Website/style.css): blush paper, ink, rose accent,
   square corners, hard offset shadows, heavy tight system sans. */
:root {
  color-scheme: light;
  --bg: #fff9f5; --paper: #fffdfb; --ink: #28262b; --ink-soft: #5d565b; --ink-faint: #766d71;
  --accent: #9f3b52; --accent-bright: #e9687e; --accent-wash: #f9eae6; --line: #9a858a;
  --line-soft: #e5d9d7; --shadow: #e9d9d6; --dark: #29272c; --dark-2: #343137; --dark-line: #4a4549;
  --dark-text: #fff5ef; --dark-soft: #cfc3bf; --pink-shadow: #e8b7b8;
  --worker: #ecc16b; --manager: #79cda5; --steward: #c99a7a; --survivor: #e9687e; --coin: #ffb1b5;
  --user: #9ab8e8; --good: #3f8f6a; --bad: #9f3b52;
  font-family: ui-sans-serif, system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; color: var(--ink); font-size: 15px; line-height: 1.5; font-variant-numeric: tabular-nums;
  background: radial-gradient(circle at 88% 5%, #ffd8d8, transparent 25%), var(--bg); min-height: 100vh; }
main { max-width: 1260px; margin: auto; padding: 26px 16px 60px; }
.topline { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; flex-wrap: wrap;
  border-bottom: 2px solid var(--dark); padding-bottom: 14px; }
.mark { margin: 0; font-size: clamp(40px, 5vw, 64px); line-height: .92; letter-spacing: -.07em; font-weight: 900; }
.mark em { font-style: normal; color: var(--accent-bright); }
.stamp { color: var(--ink-faint); font-size: 13px; }
.summary { margin: 16px 0 0; font-size: clamp(17px, 2vw, 22px); line-height: 1.35; color: var(--ink-soft); }
.summary b { color: var(--ink); font-weight: 900; }
.dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 10px;
  background: var(--manager); border: 2px solid var(--dark); vertical-align: 1px; }
.dot.bad { background: var(--accent-bright); }
.alert { margin-top: 18px; padding: 13px 18px; border-left: 5px solid var(--accent-bright); background: var(--accent-wash); }
.alert:empty { display: none; }
.stage { margin-top: 26px; background: var(--dark); color: var(--dark-text); border: 2px solid var(--dark);
  box-shadow: 7px 7px 0 var(--pink-shadow); padding: 20px; display: grid; gap: 22px;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.model h3 { margin: 0 0 10px; font-size: 18px; letter-spacing: -.03em; }
.model h3 span { font-weight: 500; font-size: 13px; color: var(--dark-soft); margin-left: 8px; }
.lane { display: flex; align-items: center; gap: 14px; padding: 12px; margin-bottom: 10px; background: var(--dark-2);
  border: 1px solid var(--dark-line); border-radius: 44px; min-height: 64px; }
.orb { width: 40px; height: 40px; border-radius: 50%; flex: none; border: 1.5px dashed #5b5358; }
.orb.on { border: 0; background: radial-gradient(circle at 35% 30%, #fff9 0%, var(--c) 40%, color-mix(in oklab, var(--c) 60%, #000) 100%);
  box-shadow: 0 0 24px -4px var(--c); animation: breathe 3.2s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(1.08); } }
.lane b { display: block; font-size: 14px; } .lane small { color: var(--dark-soft); }
.queue { font-size: 13px; color: var(--dark-soft); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; margin-top: 34px; }
.panel { border: 1px solid var(--line); background: var(--paper); box-shadow: 4px 4px 0 var(--shadow); padding: 20px 22px; min-width: 0; }
.panel.wide { grid-column: 1 / -1; }
h2 { font-size: clamp(24px, 2.6vw, 30px); line-height: 1; letter-spacing: -.055em; margin: 0 0 12px; font-weight: 900; }
.row { display: grid; grid-template-columns: 5px 1fr auto; gap: 2px 12px; padding: 10px 0; border-top: 1px solid var(--line-soft); }
.row:first-of-type { border-top: 0; }
.row .bar { grid-row: 1 / 3; background: var(--c); border: 1px solid var(--dark); }
.row .who { font-weight: 900; letter-spacing: -.02em; overflow-wrap: anywhere; }
.row .state { font-size: 14px; color: var(--ink-soft); text-align: right; }
.row .meta { grid-column: 2 / 4; font-size: 13px; color: var(--ink-faint); overflow-wrap: anywhere; }
.muted { color: var(--ink-faint); }
.check { display: flex; gap: 10px; padding: 4px 0; } .check .ok { color: var(--good); font-weight: 900; }
.check .no { color: var(--bad); font-weight: 900; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.fact b { display: block; font-size: 26px; letter-spacing: -.05em; } .fact span { font-size: 13px; color: var(--ink-faint); }
.history { font-size: 13px; max-height: 360px; overflow: auto; }
.history div { padding: 3px 0; border-top: 1px solid var(--line-soft); overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
  <div class="topline"><h1 class="mark">Coint<em>OS</em></h1><span class="stamp" id="stamp">connecting…</span></div>
  <p class="summary" id="summary"></p>
  <div class="alert" id="alert"></div>
  <div class="stage" id="stage"></div>
  <div class="grid">
    <section class="panel"><h2>Agents</h2><div id="agents"></div></section>
    <section class="panel"><h2>Machine</h2><div class="facts" id="machine"></div><h2 style="margin-top:22px">Self-check</h2><div id="checks"></div></section>
    <section class="panel wide"><h2>Tasks</h2><div id="tasks"></div></section>
    <section class="panel wide"><h2>Recently</h2><div class="history" id="history"></div></section>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const ago = t => { const s = Math.max(0, Date.now() / 1000 - t) | 0;
  return s < 120 ? s + "s" : s < 7200 ? (s / 60 | 0) + "m" : (s / 3600 | 0) + "h"; };
const colour = (caller, state) => { const role = (caller || "").split(/[-:]/)[0];
  return `var(--${["worker", "manager", "steward", "survivor", "coin", "user"].includes(role) ? role : "user"})`; };

function render(L) {
  const agents = Object.values(L.agents), failing = L.checks.filter(c => !c.ok);
  const waiting = Object.values(L.requests).filter(r => r.lane === null);
  $("stamp").textContent = "updated " + new Date(L.updated_at * 1000).toLocaleTimeString();
  $("summary").innerHTML = `<span class="dot ${failing.length ? "bad" : ""}"></span>` +
    `<b>${L.paused ? "Paused" : "Running"}</b> · ${agents.length} agent${agents.length === 1 ? "" : "s"} · ` +
    `${waiting.length} waiting for a lane · self-check ${failing.length ? "<b>red</b>" : "green"}`;
  $("alert").innerHTML = [...L.guard.breaches.map(b => "Guard: " + esc(b)),
    ...failing.map(c => esc(c.name + ": " + c.detail))].join("<br>");
  $("stage").innerHTML = Object.entries(L.models).map(([name, m]) => {
    const lanes = L.lanes.filter(l => l.model === name).map(l => {
      const agent = L.agents[l.caller], req = L.requests[l.occupant];
      return `<div class="lane"><div class="orb ${l.caller ? "on" : ""}" style="--c:${colour(l.caller)}"></div><div>` +
        (l.caller ? `<b>${esc(l.caller)}</b><small>${agent ? esc(agent.project + ": " + agent.title) : ""} · ${req ? ago(req.started_at) : ""}</small>`
                  : `<b>${l.up ? "idle" : "down"}</b><small>lane ${l.index} · served ${l.served}</small>`) + `</div></div>`; }).join("");
    const queued = waiting.filter(r => r.model === name);
    return `<div class="model"><h3>${esc(name)}<span>${m.loaded ? "loaded" : "down: " + esc(m.problems.join("; "))}</span></h3>${lanes}` +
      `<div class="queue">${queued.length ? "waiting: " + queued.map(r => esc(r.caller)).join(", ") : "nobody waiting"}</div></div>`; }).join("");
  $("agents").innerHTML = agents.length ? agents.map(a => {
    const onLane = L.lanes.some(l => l.caller === a.id), queued = waiting.some(r => r.caller === a.id);
    return `<div class="row" style="--c:${colour(a.id)}"><div class="bar"></div><div class="who">${esc(a.id)}</div>` +
      `<div class="state">${onLane ? "on a lane" : queued ? "waiting for a lane" : esc(a.state)}</div>` +
      `<div class="meta">${esc(a.project)}: ${esc(a.title)} · up ${ago(a.started_at)} · ${a.requests} requests · last ${ago(a.last_activity)} ago</div></div>`;
  }).join("") : `<p class="muted">No live agents.</p>`;
  const m = L.machine;
  $("machine").innerHTML = m.mem_available_gb === undefined ? "" : [
    [m.mem_available_gb + " GB", "available memory"], [m.gpu_used_gb + " GB", "GPU memory"],
    [m.psi_full_avg10, "memory pressure"], [m.swap_used_gb + " GB", "swap used"]]
    .map(([v, k]) => `<div class="fact"><b>${esc(v)}</b><span>${k}</span></div>`).join("");
  $("checks").innerHTML = L.checks.map(c => `<div class="check"><span class="${c.ok ? "ok" : "no"}">${c.ok ? "ok" : "fail"}</span>` +
    `<span>${esc(c.name)}${c.detail ? ": " + esc(c.detail) : ""}</span></div>`).join("");
  const tasks = Object.values(L.tasks).sort((a, b) => b.updated_at - a.updated_at).slice(0, 25);
  $("tasks").innerHTML = tasks.length ? tasks.map(t => `<div class="row" style="--c:var(--${t.role})"><div class="bar"></div>` +
    `<div class="who">${esc(t.project)}: ${esc(t.title)}</div><div class="state">${esc(t.status)} · run ${t.runs}</div>` +
    `<div class="meta">${esc(t.role)} · ${ago(t.updated_at)} ago${t.note ? " · " + esc(t.note) : ""}</div></div>`).join("")
    : `<p class="muted">No tasks yet.</p>`;
  $("history").innerHTML = L.history.slice(-60).reverse().map(h => {
    const {at, event, ...rest} = h;
    return `<div><span class="muted">${new Date(at * 1000).toLocaleTimeString()}</span> <b>${esc(event)}</b> ` +
      esc(Object.entries(rest).map(([k, v]) => `${k}=${typeof v === "object" ? JSON.stringify(v) : v}`).join(" ")) + `</div>`; }).join("");
}

async function poll() {
  try { render(await (await fetch("/api/ledger", {cache: "no-store"})).json()); }
  catch (e) { $("stamp").textContent = "daemon unreachable"; }
  setTimeout(poll, 2000);
}
poll();
</script>
</body>
</html>
