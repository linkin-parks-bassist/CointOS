<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CointOS</title>
<style>
/* Styled after David's site (~/Projects/Website/style.css): blush paper, ink, rose accent,
   square corners, hard offset shadows, heavy tight system sans. */
:root {
  color-scheme: light;
  --bg: #fff9f5; --paper: #fffdfb; --ink: #28262b; --ink-soft: #5d565b; --ink-faint: #766d71;
  --accent: #9f3b52; --accent-bright: #e9687e; --accent-wash: #f9eae6; --line: #9a858a;
  --line-soft: #e5d9d7; --shadow: #e9d9d6; --dark: #29272c; --dark-2: #343137; --dark-line: #4a4549;
  --dark-text: #fff5ef; --dark-soft: #cfc3bf; --pink-shadow: #e8b7b8;
  --worker: #ecc16b; --manager: #79cda5; --steward: #c99a7a; --survivor: #e9687e; --coin: #ffb1b5;
  --user: #9ab8e8; --good: #3f8f6a; --bad: #9f3b52;
  font-family: ui-sans-serif, system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; color: var(--ink); font-size: 15px; line-height: 1.5; font-variant-numeric: tabular-nums;
  background: radial-gradient(circle at 88% 5%, #ffd8d8, transparent 25%), var(--bg); min-height: 100vh; }
main { max-width: 1260px; margin: auto; padding: 26px 16px 60px; }
.topline { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; flex-wrap: wrap;
  border-bottom: 2px solid var(--dark); padding-bottom: 14px; }
.mark { margin: 0; font-size: clamp(40px, 5vw, 64px); line-height: .92; letter-spacing: -.07em; font-weight: 900; }
.mark em { font-style: normal; color: var(--accent-bright); }
.stamp { color: var(--ink-faint); font-size: 13px; }
.summary { margin: 16px 0 0; font-size: clamp(17px, 2vw, 22px); line-height: 1.35; color: var(--ink-soft); }
.summary b { color: var(--ink); font-weight: 900; }
.dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 10px;
  background: var(--manager); border: 2px solid var(--dark); vertical-align: 1px; }
.dot.bad { background: var(--accent-bright); }
.alert { margin-top: 18px; padding: 13px 18px; border-left: 5px solid var(--accent-bright); background: var(--accent-wash); }
.alert:empty { display: none; }
.agents { margin-top: 26px; display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); }
.agent { background: var(--dark); color: var(--dark-text); border: 2px solid var(--dark); box-shadow: 7px 7px 0 var(--pink-shadow);
  padding: 18px 20px; display: grid; grid-template-columns: 46px 1fr; gap: 4px 16px; min-width: 0; }
.agent .orb { grid-row: 1 / 3; width: 46px; height: 46px; border-radius: 50%; border: 2px dashed var(--c); }
.agent .orb.thinking { border: 0; background: radial-gradient(circle at 35% 30%, #fff9 0%, var(--c) 40%, color-mix(in oklab, var(--c) 60%, #000) 100%);
  box-shadow: 0 0 26px -4px var(--c); animation: breathe 3.2s ease-in-out infinite; }
.agent .orb.tools { border-style: solid; background: color-mix(in oklab, var(--c) 30%, transparent); }
@keyframes breathe { 50% { transform: scale(1.08); } }
.agent .role { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--c); font-weight: 900; }
.agent .work { font-size: 20px; font-weight: 900; letter-spacing: -.04em; line-height: 1.15; overflow-wrap: anywhere; }
.agent .now { grid-column: 1 / -1; margin-top: 10px; font-size: 14px; }
.agent .now b { color: var(--c); }
.agent .doing { grid-column: 1 / -1; font: 13px/1.45 ui-monospace, monospace; color: var(--dark-soft); background: var(--dark-2);
  border: 1px solid var(--dark-line); padding: 8px 10px; margin-top: 6px; overflow-wrap: anywhere; max-height: 6.2em; overflow: hidden; }
.agent .meta { grid-column: 1 / -1; margin-top: 8px; font-size: 12px; color: var(--dark-soft); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }
.agent .progress { grid-column: 1 / -1; height: 6px; margin-top: 8px; background: var(--dark-2); border: 1px solid var(--dark-line); }
.agent .progress span { display: block; height: 100%; background: var(--c); transition: width 1.5s linear; }
.empty { margin-top: 26px; padding: 26px; border: 2px dashed var(--line); color: var(--ink-soft); font-size: 18px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; margin-top: 34px; }
.panel { border: 1px solid var(--line); background: var(--paper); box-shadow: 4px 4px 0 var(--shadow); padding: 20px 22px; min-width: 0; }
.panel.wide { grid-column: 1 / -1; }
h2 { font-size: clamp(24px, 2.6vw, 30px); line-height: 1; letter-spacing: -.055em; margin: 0 0 12px; font-weight: 900; }
h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-faint); margin: 18px 0 4px; }
.row { display: grid; grid-template-columns: 5px 1fr auto; gap: 2px 12px; padding: 10px 0; border-top: 1px solid var(--line-soft); }
.row .bar { grid-row: 1 / 3; background: var(--c); border: 1px solid var(--dark); }
.row .who { font-weight: 900; letter-spacing: -.02em; overflow-wrap: anywhere; }
.row .state { font-size: 14px; color: var(--ink-soft); text-align: right; }
.row .meta { grid-column: 2 / 4; font-size: 13px; color: var(--ink-faint); overflow-wrap: anywhere; }
.muted { color: var(--ink-faint); }
.resources { font-size: 14px; }
.resource { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line-soft); }
.resource:first-child { border-top: 0; }
.resource .name { font-weight: 900; min-width: 150px; }
.chip { font-size: 12px; padding: 2px 9px; border: 1px solid var(--line); border-radius: 20px; background: var(--bg); }
.chip.held { background: var(--c); border-color: var(--dark); }
.check { display: flex; gap: 10px; padding: 3px 0; font-size: 14px; } .check .ok { color: var(--good); font-weight: 900; }
.check .no { color: var(--bad); font-weight: 900; }
.history { font-size: 13px; max-height: 360px; overflow: auto; }
.history div { padding: 3px 0; border-top: 1px solid var(--line-soft); overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
  <div class="topline"><h1 class="mark">Coint<em>OS</em></h1><span class="stamp" id="stamp">connecting…</span></div>
  <p class="summary" id="summary"></p>
  <div class="alert" id="alert"></div>
  <div id="agents"></div>
  <div class="grid">
    <section class="panel wide"><h2>Work</h2><div id="work"></div></section>
    <section class="panel"><h2>Resources</h2><div class="resources" id="resources"></div></section>
    <section class="panel"><h2>Self-check</h2><div id="checks"></div></section>
    <section class="panel wide"><h2>Recently</h2><div class="history" id="history"></div></section>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const ago = t => { const s = Math.max(0, Date.now() / 1000 - t) | 0;
  return s < 120 ? s + "s" : s < 7200 ? (s / 60 | 0) + "m" : (s / 3600 | 0) + "h"; };
const ROLES = ["worker", "manager", "steward", "survivor", "coin", "user"];
const colour = who => { const role = (who || "").split(/[-:]/)[0]; return `var(--${ROLES.includes(role) ? role : "user"})`; };
const short = model => model.replace(/-GGUF$/, "");

// What an agent is doing right now, from its thoughts.
function phase(L, a) {
  const mine = Object.values(L.thoughts).filter(t => t.agent === a.id);
  const running = mine.find(t => t.lane !== null), queued = mine.find(t => t.lane === null);
  if (a.state === "starting") return ["starting", "Starting up", ""];
  if (running && a.state === "reading") {
    const share = Math.min(1, (running.held || 0) / Math.max(1, running.prompt));
    return ["thinking", "Reading its context", `${Math.round(share * 100)}% of ${running.prompt.toLocaleString()} tokens`, share];
  }
  if (running) return ["thinking", "Thinking", `for ${ago(running.since)} on ${short(running.model)} · ${running.generated} tokens so far`];
  if (queued) return ["waiting", "Waiting for a lane", `for ${ago(queued.waiting_since)}`];
  return ["tools", "Acting", "running its tools"];
}

function renderAgents(L) {
  const agents = Object.values(L.agents).sort((a, b) => a.started_at - b.started_at);
  if (!agents.length) {
    $("agents").innerHTML = `<div class="empty">${L.paused ? "Agents are paused. <b>cointos go</b> lets them run again."
      : "No agents right now. They start as work appears in the queues."}</div>`;
    return;
  }
  $("agents").innerHTML = `<div class="agents">` + agents.map(a => {
    const [kind, label, detail, share] = phase(L, a), task = L.tasks[a.task] || {};
    return `<article class="agent" style="--c:${colour(a.id)}"><div class="orb ${kind}"></div>` +
      `<div class="role">${esc(a.role)} · ${esc(a.project)}</div>` +
      `<div class="work">${esc(a.title.replace(/-/g, " "))}</div>` +
      `<div class="now"><b>${label}</b> ${esc(detail)}</div>` +
      (share === undefined ? "" : `<div class="progress"><span style="width:${(share * 100).toFixed(1)}%"></span></div>`) +
      (a.doing ? `<div class="doing">${esc(a.doing)}</div>` : "") +
      `<div class="meta">${esc(a.id)} · up ${ago(a.started_at)} · ${a.thoughts} thoughts · run ${task.runs ?? "?"}</div></article>`;
  }).join("") + `</div>`;
}

function renderWork(L) {
  const groups = [["running", "In progress"], ["waiting", "Up next"], ["done", "Done"], ["failed", "Gave up"]];
  const tasks = Object.values(L.tasks).sort((a, b) => b.updated_at - a.updated_at);
  $("work").innerHTML = tasks.length ? groups.map(([status, title]) => {
    const some = tasks.filter(t => t.status === status).slice(0, status === "done" ? 10 : 50);
    return some.length ? `<h3>${title}</h3>` + some.map(t => `<div class="row" style="--c:var(--${t.role})"><div class="bar"></div>` +
      `<div class="who">${esc(t.project)}: ${esc(t.title.replace(/-/g, " "))}</div>` +
      `<div class="state">${esc(t.role)} · run ${t.runs} · ${ago(t.updated_at)} ago</div>` +
      `<div class="meta">${esc(status === "done" && t.result ? t.result.slice(-300) : t.note || "")}</div></div>`).join("") : "";
  }).join("") : `<p class="muted">No work yet.</p>`;
}

function renderResources(L) {
  const waiting = Object.values(L.thoughts).filter(t => t.lane === null);
  const models = Object.entries(L.models).map(([name, m]) => {
    const lanes = L.lanes.filter(l => l.model === name).map(l => {
      const holder = L.thoughts[l.holder];
      return holder ? `<span class="chip held" style="--c:${colour(holder.agent)}">lane ${l.index}: ${esc(holder.agent)}</span>`
                    : `<span class="chip">lane ${l.index}: ${l.up ? "free" : "down"}</span>`; }).join("");
    const queued = waiting.filter(t => t.model === name).length;
    return `<div class="resource"><span class="name">${esc(short(name))}</span>` +
      (m.up ? lanes : `<span class="chip">${m.launching ? "launching" : esc(m.problems.join("; "))}</span>`) +
      (queued ? `<span class="muted">${queued} waiting</span>` : "") + `</div>`; }).join("");
  const m = L.memory, g = L.guard, snaps = Object.values(L.snapshots);
  const memory = m.headroom_gb === undefined ? "" : `<div class="resource"><span class="name">Memory</span>` +
    `<span class="chip">headroom ${m.headroom_gb} GB</span><span class="chip">${m.available_gb} GB available</span>` +
    `<span class="chip">pressure ${m.psi}</span><span class="chip">swap ${m.swap_gb} GB</span>` +
    (g.blocked ? `<span class="chip held" style="--c:var(--accent-bright)">background waiting for memory</span>` : "") +
    (g.killed ? `<span class="chip held" style="--c:var(--accent-bright)">work model killed</span>` : "") + `</div>` +
    `<div class="resource"><span class="name">Saved contexts</span>` +
    ["memory", "disk"].map(tier => { const here = snaps.filter(s => (s.tier === "memory") === (tier === "memory"));
      return `<span class="chip">${here.length} in ${tier} · ${(here.reduce((n, s) => n + s.bytes, 0) / 1e9).toFixed(1)} GB</span>`; }).join("") +
    `</div>`;
  $("resources").innerHTML = models + memory;
}

function render(L) {
  const agents = Object.values(L.agents), failing = L.checks.filter(c => !c.ok);
  const count = s => Object.values(L.tasks).filter(t => t.status === s).length;
  const thinking = agents.filter(a => a.state === "thinking").length;
  $("stamp").textContent = "updated " + new Date(L.updated_at * 1000).toLocaleTimeString();
  $("summary").innerHTML = `<span class="dot ${failing.length ? "bad" : ""}"></span>` +
    (L.paused ? `<b>Paused.</b> ` : "") +
    `<b>${agents.length} agent${agents.length === 1 ? "" : "s"}</b> at work, ${thinking} thinking right now · ` +
    `${count("waiting")} task${count("waiting") === 1 ? "" : "s"} up next · ${count("done")} done` +
    (failing.length ? ` · <b>self-check red</b>` : "");
  $("alert").innerHTML = failing.map(c => esc(c.name + ": " + c.detail)).join("<br>");
  renderAgents(L);
  renderWork(L);
  renderResources(L);
  $("checks").innerHTML = L.checks.map(c => `<div class="check"><span class="${c.ok ? "ok" : "no"}">${c.ok ? "ok" : "fail"}</span>` +
    `<span>${esc(c.name)}${c.detail ? ": " + esc(c.detail) : ""}</span></div>`).join("");
  $("history").innerHTML = L.history.slice(-60).reverse().map(h => {
    const {at, event, ...rest} = h;
    return `<div><span class="muted">${new Date(at * 1000).toLocaleTimeString()}</span> <b>${esc(event)}</b> ` +
      esc(Object.entries(rest).map(([k, v]) => `${k}=${typeof v === "object" ? JSON.stringify(v) : v}`).join(" ")) + `</div>`; }).join("");
}

async function poll() {
  try { render(await (await fetch("/api/ledger", {cache: "no-store"})).json()); }
  catch (e) { $("stamp").textContent = "daemon unreachable"; }
  setTimeout(poll, 2000);
}
poll();
</script>
</body>
</html>
