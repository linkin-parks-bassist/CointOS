<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CointOS</title>
<style>
/* Visual palette: blush paper, ink, rose accent,
   square corners, hard offset shadows, heavy tight system sans. */
:root {
  color-scheme: light;
  --bg: #fff9f5; --paper: #fffdfb; --ink: #28262b; --ink-soft: #5d565b; --ink-faint: #766d71;
  --accent: #9f3b52; --accent-bright: #e9687e; --accent-wash: #f9eae6; --line: #9a858a;
  --line-soft: #e5d9d7; --shadow: #e9d9d6; --dark: #29272c; --dark-2: #343137; --dark-line: #4a4549;
  --dark-text: #fff5ef; --dark-soft: #cfc3bf; --pink-shadow: #e8b7b8;
  font-family: ui-sans-serif, system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; color: var(--ink); font-size: 15px; line-height: 1.5; font-variant-numeric: tabular-nums;
  background: radial-gradient(circle at 88% 5%, #ffd8d8, transparent 25%), var(--bg); min-height: 100vh; }
main { max-width: 1840px; margin: auto; padding: 26px 16px 60px; }
.topline { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; flex-wrap: wrap;
  border-bottom: 2px solid var(--dark); padding-bottom: 14px; }
.mark { margin: 0; font-size: clamp(40px, 5vw, 64px); line-height: .92; letter-spacing: -.07em; font-weight: 900; }
.mark em { font-style: normal; color: var(--accent-bright); }
.scheduler-controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 16px; margin: 4px 0 14px; }
.scheduler-control { display: grid; gap: 3px; }
.scheduler-control label { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-faint); font-weight: 800; }
.scheduler-control small { font-size: 11px; line-height: 1.3; }
.scheduler-control select { font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line); padding: 6px 10px; }
.scheduler-control small { color: var(--ink-faint); }
.stamp { color: var(--ink-faint); font-size: 13px; }
.alert { margin-top: 18px; padding: 13px 18px; border-left: 5px solid var(--accent-bright); background: var(--accent-wash); }
.alert:empty { display: none; }
.agents { display: grid; gap: 18px; grid-template-columns: repeat(6, minmax(0, 1fr)); --capacity: 1; }
/* Cards pair up once the agents column itself is wide enough, whatever the window does. */
#agents { container-type: inline-size; }
@container (min-width: 640px) { .agents { --capacity: 2; } }
@container (min-width: 1250px) { .agents { --capacity: 3; } }
.agent { --c: var(--accent-bright); position: relative; background: var(--dark); color: var(--dark-text); border: 2px solid var(--dark); box-shadow: 7px 7px 0 var(--pink-shadow);
  padding: 18px 20px 11px; display: grid; grid-template-columns: 18px 1fr auto; gap: 4px 14px; min-width: 0; }
/* The agent's state, as a flat square: solid (and slowly pulsing) while the model works for it,
   an outline while it waits for a lane, cream while its tools run, dashed while it starts. */
.agent .mark { grid-row: 1 / 4; width: 18px; height: 18px; margin-top: 3px; border: 2px solid var(--c); }
.agent .mark.thinking { background: var(--c); animation: pulse 2.4s ease-in-out infinite; }
.agent .mark.tools { background: var(--dark-text); border-color: var(--dark-text); }
.agent .mark.starting { border-style: dashed; }
@keyframes pulse { 50% { opacity: .45; } }
/* Uptime, tokens written, and speed while writing: a fixed three lines, so cards keep their size. */
.agent .stats { grid-column: 3; grid-row: 1 / 4; text-align: right; font-size: 12px; line-height: 1.35;
  color: var(--dark-soft); white-space: nowrap; font-variant-numeric: tabular-nums; }
.agent .stats b { display: block; font: 900 20px/1.05 ui-sans-serif, system-ui, sans-serif; letter-spacing: -.03em;
  color: var(--dark-text); }
.agent .stats span { display: block; min-height: 1.35em; }
.agent .role { grid-column: 2; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--c); font-weight: 900; }
.agent .work { grid-column: 2; font-size: 20px; font-weight: 900; letter-spacing: -.04em; line-height: 1.15; overflow-wrap: anywhere; }
.agent .now { grid-column: 1 / -1; margin-top: 10px; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.agent .now b { color: var(--c); }
/* The agent's words as they stream, bottom-anchored like a terminal, at a fixed height. */
.agent .live { position: relative; grid-column: 1 / -1; margin-top: 10px; height: 7.9em; overflow: hidden; display: flex;
  flex-direction: column; justify-content: flex-end; font: 12.5px/1.45 ui-monospace, monospace; background: var(--dark-2);
  border: 1px solid var(--dark-line); padding: 8px 10px; }
/* The oldest words fade into the box; the box itself keeps its edges. */
.agent .live::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2.8em; z-index: 1;
  background: linear-gradient(color-mix(in oklab, var(--dark-2) 80%, transparent), transparent); pointer-events: none; }
.agent .live i { color: var(--dark-soft); opacity: .75; white-space: pre-wrap; overflow-wrap: anywhere; }
.agent .live p { margin: 6px 0 0; color: var(--dark-text); white-space: pre-wrap; overflow-wrap: anywhere; }
.agent .live p.tool { color: var(--c); }
.agent .meta { grid-column: 2; margin-top: 2px; font-size: 12px; color: var(--dark-soft); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }
/* Along the card's bottom edge, out of the layout: showing it moves nothing. */
.agent .progress { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--dark-2); }
.agent .progress span { display: block; height: 100%; background: var(--c); transition: width 1.5s linear; }
.empty { padding: 26px; border: 2px dashed var(--line); color: var(--ink-soft); font-size: 18px; }
/* Two columns: what agents are doing and what waits for them; beside it, the machine they share. */
.cols { display: grid; gap: 22px; margin-top: 22px; align-items: start; }
.col-main, .col-side { display: grid; gap: 22px; min-width: 0; align-content: start; }
@media (min-width: 1100px) {
  .cols { grid-template-columns: minmax(0, 1.7fr) minmax(360px, 1fr); }
  .col-side { position: sticky; top: 14px; max-height: calc(100vh - 28px); overflow: auto; padding: 0 8px 8px 0; }
}
/* The whole system at a glance. */
.strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-top: 18px; }
.tile { background: var(--paper); border: 1px solid var(--line); box-shadow: 3px 3px 0 var(--shadow); padding: 10px 14px 9px; min-width: 0; }
.tile span { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-faint); font-weight: 800; }
.tile b { display: block; font: 900 28px/1.05 ui-sans-serif, system-ui, sans-serif; letter-spacing: -.05em; margin: 3px 0 1px; }
.tile small { display: block; font-size: 12px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile.dark { background: var(--dark); border-color: var(--dark); color: var(--dark-text); box-shadow: 3px 3px 0 var(--pink-shadow); }
.tile.dark span, .tile.dark small { color: var(--dark-soft); } .tile.dark b { color: var(--accent-bright); }
.tile.bad { background: var(--accent-wash); border-color: var(--accent); } .tile.bad b { color: var(--accent); }
.tile .meter { height: 5px; margin-top: 6px; background: var(--line-soft); } .tile .meter i { display: block; height: 100%; background: var(--accent); transition: width 1s; }
.panel { border: 1px solid var(--line); background: var(--paper); box-shadow: 4px 4px 0 var(--shadow); padding: 16px 18px; min-width: 0; }
.fold > summary { cursor: pointer; list-style: none; } .fold > summary::-webkit-details-marker { display: none; }
.fold > summary h2 { display: inline; } .fold > summary::after { content: " ▸"; color: var(--accent); font-weight: 900; }
.fold[open] > summary::after { content: " ▾"; } .fold[open] > summary { margin-bottom: 10px; }
h2 { font-size: clamp(21px, 2vw, 25px); line-height: 1; letter-spacing: -.055em; margin: 0 0 12px; font-weight: 900; }
.panel-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.panel-heading h2 { margin-bottom: 12px; }
.scout-control { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.scout-control button { font: 800 13px/1 ui-sans-serif, system-ui, sans-serif; color: var(--accent); background: var(--paper);
  border: 1px solid var(--accent); padding: 7px 11px; cursor: pointer; box-shadow: 2px 2px 0 var(--pink-shadow); }
.scout-control button:hover:not(:disabled) { background: var(--accent-wash); }
.scout-control button:active:not(:disabled) { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--pink-shadow); }
.scout-control button:disabled { color: var(--ink-faint); border-color: var(--line); box-shadow: none; cursor: default; }
.scout-control small { color: var(--ink-faint); }
.project-list { display: grid; gap: 0; }
.project-row { display: grid; grid-template-columns: minmax(160px, .7fr) minmax(260px, 1.4fr) auto; gap: 8px 18px;
  align-items: center; padding: 11px 0; border-top: 1px solid var(--line-soft); }
.project-row:first-child { border-top: 0; }
.project-name { font-weight: 900; font-size: 17px; }
.project-path { color: var(--ink-faint); overflow-wrap: anywhere; }
.project-controls { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 8px; }
.project-controls input[type=number] { width: 72px; }
.project-controls button, .project-form button { font: 800 13px/1 ui-sans-serif, system-ui, sans-serif; color: var(--accent);
  background: var(--paper); border: 1px solid var(--accent); padding: 7px 10px; cursor: pointer; }
.project-form { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 13px; }
.project-form summary { cursor: pointer; font-weight: 900; color: var(--accent); }
.project-fields { display: grid; grid-template-columns: 150px minmax(180px, 1fr) minmax(220px, 2fr) 100px auto;
  gap: 10px; align-items: end; margin-top: 12px; }
.project-fields label { display: grid; gap: 3px; color: var(--ink-faint); font-size: 12px; }
.project-fields input, .project-fields select { min-width: 0; width: 100%; font: inherit; padding: 6px 8px;
  color: var(--ink); background: var(--paper); border: 1px solid var(--line); }
@media (max-width: 900px) { .project-row, .project-fields { grid-template-columns: 1fr; } .project-controls { justify-content: flex-start; } }
.col-side .project-row { grid-template-columns: 1fr; gap: 4px; } .col-side .project-controls { justify-content: flex-start; }
.col-side .project-fields { grid-template-columns: 1fr 1fr; }
h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-faint); margin: 14px 0 3px; }
.row { display: grid; grid-template-columns: 5px 1fr auto; gap: 1px 12px; padding: 7px 0; border-top: 1px solid var(--line-soft); }
.row .bar { grid-row: 1 / 3; background: var(--line-soft); border: 1px solid var(--dark); }
.row.running .bar { background: var(--accent-bright); } .row.done .bar { background: var(--ink-faint); }
.row.failed .bar { background: var(--accent); }
.row .who { font-weight: 900; letter-spacing: -.02em; overflow-wrap: anywhere; }
.row .state { font-size: 13px; color: var(--ink-soft); text-align: right; }
.row .meta { grid-column: 2 / 4; font-size: 13px; color: var(--ink-faint); overflow-wrap: anywhere; }
.muted { color: var(--ink-faint); }
.chip { font-size: 12px; padding: 2px 9px; border: 1px solid var(--line); border-radius: 20px; background: var(--bg); }
.chip.held { background: var(--accent-wash); border-color: var(--accent); color: var(--accent); font-weight: 700; }
.machine-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 6px 32px; }
.lane-row { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto auto; align-items: center; gap: 10px; padding: 5px 0;
  border-top: 1px solid var(--line-soft); font-size: 14px; }
.lane-row:first-of-type { border-top: 0; }
.lane-row .name { font-weight: 900; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* A lane as a square: filled while an agent holds it, outlined while free, faint while down. */
.lane-row .sq { width: 12px; height: 12px; border: 2px solid var(--dark); }
.lane-row.held .sq { background: var(--accent-bright); animation: pulse 2.4s ease-in-out infinite; }
.lane-row.down .sq { border-color: var(--line-soft); }
.memhead { display: flex; align-items: baseline; gap: 8px; }
.memhead b { font: 900 26px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: -.05em; }
.memhead span { color: var(--ink-faint); font-size: 13px; }
.membar { display: flex; gap: 2px; height: 24px; margin: 8px 0 10px; padding: 2px; border: 2px solid var(--dark);
  background: var(--paper); box-shadow: 3px 3px 0 var(--shadow); }
.membar .seg { height: 100%; min-width: 0; transition: width 1s, opacity .15s; }
.legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 1px 16px; font-size: 13px; }
.legend .item { display: grid; grid-template-columns: 12px 1fr auto 40px; align-items: center; gap: 8px; padding: 2px 4px; }
.legend .item.on { background: var(--accent-wash); }
.legend i { width: 12px; height: 12px; border-radius: 2px; }
.legend b { font-variant-numeric: tabular-nums; } .legend em { font-style: normal; color: var(--ink-faint); text-align: right; }
.memfacts { margin-top: 6px; font-size: 13px; color: var(--ink-faint); }
.check { margin-top: 16px; padding: 8px 12px; font-size: 14px; border: 1px solid var(--line); }
.check.ok { color: var(--ink); font-weight: 900; background: var(--paper); }
.check.no { color: var(--accent); border-color: var(--accent); background: var(--accent-wash); } .check.no + .check.no { margin-top: 6px; }
.meta.one { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* Finished work, folded away; opened, a bounded list that keeps its scroll through updates. */
.done summary { cursor: pointer; list-style: none; } .done summary::-webkit-details-marker { display: none; }
.done summary h3 { display: inline-block; } .done summary h3::before { content: "▸ "; } .done[open] summary h3::before { content: "▾ "; }
.done-list { max-height: 420px; overflow: auto; }
.history { font-size: 13px; max-height: 320px; overflow: auto; }
.history div { display: flex; gap: 12px; padding: 4px 0; border-top: 1px solid var(--line-soft); }
.history .when { color: var(--ink-faint); flex: none; font-variant-numeric: tabular-nums; }
.history .what { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.history .alert-line .what { color: var(--accent); font-weight: 700; }
/* Each role has its own colour, shared by its agent cards, its pipeline step and its badge. */
.agent.r-worker { --c: var(--accent-bright); } .agent.r-integrator { --c: #8fc7b5; } .agent.r-manager { --c: #f2c46b; }
.agent.r-steward, .agent.r-gardener, .agent.r-tree-auditor, .agent.r-test-auditor, .agent.r-operator { --c: #c9b3e0; }
.agent { cursor: pointer; }
.agent:hover { box-shadow: 7px 7px 0 var(--accent-bright); }
.agent .role { justify-self: start; color: var(--dark); background: var(--c); padding: 2px 8px; font-size: 12.5px; letter-spacing: .1em; }
.agent .role em { font-style: normal; font-weight: 700; text-transform: none; letter-spacing: 0; opacity: .8; }
/* Where the agent's task is in the pipeline: five stops, the current one lit. */
.agent .track { grid-column: 1 / -1; display: flex; align-items: center; margin-top: 10px; font-size: 11px; color: var(--dark-soft); }
.agent .track span { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
.agent .track span::before { content: ""; width: 9px; height: 9px; border: 2px solid var(--dark-line); }
.agent .track span.past::before { background: var(--dark-line); }
.agent .track span.here { color: var(--c); font-weight: 900; } .agent .track span.here::before { background: var(--c); border-color: var(--c); }
.agent .track i { flex: 1; height: 2px; margin: 0 6px; background: var(--dark-line); min-width: 8px; }
.agent .track.upkeep { color: var(--c); font-weight: 800; }
/* The pipeline: work items flow left to right; a blocked item waits at the far left. */
.flow { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr) 22px) minmax(0, 1fr); align-items: stretch; }
.step { min-width: 0; border: 2px solid var(--dark); background: var(--paper); box-shadow: 3px 3px 0 var(--shadow); display: flex; flex-direction: column; }
.step header { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; padding: 6px 9px; border-bottom: 2px solid var(--dark);
  background: var(--sc, var(--bg)); }
.step header span { font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: .08em; }
.step header b { font: 900 22px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: -.05em; }
.step header small { display: block; font-size: 11px; color: var(--ink-faint); font-weight: 600; text-transform: none; letter-spacing: 0; }
.step.s-blocked { --sc: var(--accent-wash); } .step.s-building { --sc: #f7c1c9; } .step.s-review { --sc: #fbe7c0; }
.step.s-integrating { --sc: #cfe7df; } .step.s-landed { --sc: var(--dark); color: var(--dark-text); }
.step.s-landed header small { color: var(--dark-soft); }
.step.empty-step { opacity: .55; }
.step .chips { display: grid; gap: 4px; padding: 6px; align-content: start; }
.tchip { display: block; width: 100%; text-align: left; font: 700 12.5px/1.25 ui-sans-serif, system-ui, sans-serif; color: var(--ink);
  background: var(--bg); border: 1px solid var(--line-soft); border-left: 4px solid var(--line); padding: 4px 6px; cursor: pointer;
  overflow: hidden; }
.tchip .t { line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: break-word; hyphens: auto; }
.tchip:hover { border-color: var(--accent); border-left-color: var(--accent); background: var(--accent-wash); }
.tchip small { display: block; white-space: nowrap; font-weight: 500; font-size: 11px; line-height: 1.45; color: var(--ink-faint); overflow: hidden; text-overflow: ellipsis; }
.tchip.live { border-left-color: var(--accent-bright); } .tchip.live .t::before { content: "● "; color: var(--accent-bright); animation: pulse 1.6s infinite; }
.tchip.held { border-left-color: var(--accent); }
.tchip.more { display: block; font-weight: 500; color: var(--ink-faint); border-style: dashed; text-align: center; }
/* An arrow between steps; its dashes march while anything is moving into the next step. */
.arrow { align-self: center; height: 12px; position: relative; margin: 0 2px; }
.arrow::before { content: ""; position: absolute; left: 0; right: 6px; top: 5px; height: 2px;
  background: repeating-linear-gradient(90deg, var(--dark) 0 5px, transparent 5px 9px); }
.arrow::after { content: ""; position: absolute; right: 0; top: 0; border: 6px solid transparent; border-left: 7px solid var(--dark); border-right: 0; }
.arrow.moving::before { background: repeating-linear-gradient(90deg, var(--accent-bright) 0 5px, transparent 5px 9px);
  background-size: 9px 2px; animation: march .6s linear infinite; }
.arrow.moving::after { border-left-color: var(--accent-bright); }
@keyframes march { to { background-position: 9px 0; } }
.flow-foot { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 12px; align-items: center; font-size: 13px; }
.flow-foot h3 { margin: 0; } .flow-foot .tchip { width: auto; display: inline-block; max-width: 280px; }
.flow-foot .group { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
@media (max-width: 820px) { .flow { grid-template-columns: 1fr; } .arrow { transform: rotate(90deg); width: 22px; justify-self: center; margin: 4px 0; } }
.row { cursor: pointer; } .row:hover { background: var(--accent-wash); }
.row .meta.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
/* A project page gives the pipeline the full width; the machine panels follow below it. */
@media (min-width: 1100px) { .cols.wide { grid-template-columns: 1fr; } .cols.wide .col-side { position: static; max-height: none;
  grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); overflow: visible; } }
/* Project cards on the home page; each opens that project's page. */
.pcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.pcard { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; text-decoration: none; color: inherit; border: 2px solid var(--dark); background: var(--paper);
  box-shadow: 4px 4px 0 var(--shadow); padding: 13px 15px; min-width: 0; }
.pcard:hover { box-shadow: 4px 4px 0 var(--accent-bright); }
.pcard h4 { margin: 0; font-size: 22px; font-weight: 900; letter-spacing: -.05em; display: flex; justify-content: space-between; align-items: baseline; }
.pcard h4 small { font-size: 12px; font-weight: 700; letter-spacing: 0; color: var(--ink-faint); }
.pcard p, .phead p { margin: 0; color: var(--ink-soft); font-size: 13.5px; line-height: 1.4; }
.pcard p { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.pcard.off { opacity: .55; }
.pbar { display: flex; height: 22px; border: 2px solid var(--dark); background: var(--bg); }
.pbar span { display: flex; align-items: center; justify-content: center; font: 800 11px/1 ui-sans-serif, system-ui, sans-serif;
  border-right: 1px solid var(--dark); min-width: 0; overflow: hidden; background: var(--sc, var(--bg)); }
.pbar span:last-child { border-right: 0; }
.pbar .s-blocked { --sc: var(--accent-wash); } .pbar .s-ready { --sc: var(--paper); } .pbar .s-building { --sc: #f7c1c9; }
.pbar .s-review { --sc: #fbe7c0; } .pbar .s-integrating { --sc: #cfe7df; } .pbar .s-landed { --sc: var(--dark); color: var(--dark-text); }
.pkey { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 12px; color: var(--ink-faint); }
.pkey b { color: var(--ink); }
.pnow { font-size: 13px; display: grid; gap: 3px; min-width: 0; }
.pnow div { display: flex; align-items: center; gap: 6px; min-width: 0; }
.pnow .chip { flex: none; line-height: 1.3; }
.pnow div span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.back { color: var(--accent); font-weight: 800; text-decoration: none; font-size: 14px; }
.phead { margin: 6px 0 4px; } .phead h2 { font-size: 34px; margin: 0 0 4px; }
.tchip .sum { display: block; font-weight: 500; font-size: 11.5px; line-height: 1.4; color: var(--ink-soft); margin-top: 2px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.agent .sum { grid-column: 2; font-size: 13px; color: var(--dark-text); opacity: .85; line-height: 1.35; }
.agent .sum:empty { display: none; }
.drawer .lead { font-size: 16px; margin: 6px 0 0; }
/* Controls: small square buttons that run CointOS commands; a toast reports each outcome. */
.btn { font: 800 12.5px/1 ui-sans-serif, system-ui, sans-serif; color: var(--accent); background: var(--paper); border: 1px solid var(--accent);
  padding: 6px 9px; cursor: pointer; box-shadow: 2px 2px 0 var(--pink-shadow); }
.btn:hover:not(:disabled) { background: var(--accent-wash); } .btn:disabled { opacity: .45; cursor: default; }
.btn.danger { color: var(--paper); background: var(--accent); } .btn.danger:hover:not(:disabled) { background: #85304a; }
.agent .foot { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; margin-top: 10px; min-width: 0; }
.agent .foot .now { margin-top: 0; flex: 1; min-width: 0; }
.agent .ctl { display: flex; gap: 6px; flex: none; }
.agent .ctl .btn { background: var(--dark-2); color: var(--dark-text); border-color: var(--dark-line); box-shadow: none; padding: 4px 8px; font-size: 11.5px; }
.agent .ctl .btn:hover { border-color: var(--c); color: var(--c); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0 4px; padding: 10px 0; border-top: 1px solid var(--line-soft);
  border-bottom: 1px solid var(--line-soft); }
.actions select { font: inherit; font-size: 13px; padding: 4px 6px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
.actions .sep { width: 1px; align-self: stretch; background: var(--line-soft); }
.row .move { display: inline-flex; gap: 3px; margin-left: 8px; } .row .move .btn { padding: 2px 6px; box-shadow: none; }
.lane-free { font: inherit; font-size: 12px; cursor: pointer; white-space: nowrap; }
.lane-free b { opacity: .45; margin-left: 2px; } .lane-free:hover b { opacity: 1; } .lane-free:hover { background: var(--accent); color: var(--paper); }
/* Per-item controls stay out of sight until the pointer is on their card or row; touch screens always show them. */
@media (hover: hover) {
  .agent .ctl, .row .move { opacity: 0; transition: opacity .15s; }
  .agent:hover .ctl, .agent:focus-within .ctl, .row:hover .move, .row:focus-within .move { opacity: 1; }
}
.global-ctl { display: flex; gap: 10px; align-items: baseline; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--dark); color: var(--dark-text); padding: 10px 16px;
  border-left: 5px solid var(--accent-bright); z-index: 20; font-size: 14px; max-width: min(640px, calc(100vw - 32px)); }
.toast[hidden] { display: none; } .toast.bad { border-left-color: #ff4d5e; }
/* The detail drawer: everything known about one task. */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100vw); background: var(--paper); border-left: 3px solid var(--dark);
  box-shadow: -8px 0 0 var(--pink-shadow); z-index: 10; overflow: auto; padding: 20px 22px 40px; }
.drawer[hidden] { display: none; }
.drawer .close { position: sticky; top: 0; float: right; font: 900 20px/1 ui-sans-serif, system-ui, sans-serif; background: var(--dark); color: var(--dark-text);
  border: 0; width: 34px; height: 34px; cursor: pointer; }
.drawer h2 { font-size: 26px; margin: 4px 40px 6px 0; overflow-wrap: anywhere; }
.agent .work small { display: block; font-size: 13px; font-weight: 700; letter-spacing: 0; color: var(--dark-soft); margin-top: 2px; }
.row .who .ctx, .drawer .context { font-weight: 600; font-size: 13px; color: var(--ink-faint); letter-spacing: 0; }
.drawer .context { font-size: 15px; margin-bottom: 4px; }
.drawer .kicker { font-size: 12px; text-transform: uppercase; letter-spacing: .09em; font-weight: 900; color: var(--accent); }
.drawer .facts { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; font-size: 13.5px; margin: 12px 0; }
.drawer .facts dt { color: var(--ink-faint); } .drawer .facts dd { margin: 0; overflow-wrap: anywhere; }
.drawer .facts a { color: var(--accent); cursor: pointer; text-decoration: underline; }
.drawer .block { margin-top: 14px; } .drawer .block h3 { margin: 0 0 4px; }
.drawer pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 12.5px/1.5 ui-monospace, monospace; background: var(--bg);
  border: 1px solid var(--line-soft); padding: 9px 11px; max-height: 360px; overflow: auto; }
.scrim { position: fixed; inset: 0; background: color-mix(in oklab, var(--dark) 25%, transparent); z-index: 9; }
.scrim[hidden] { display: none; }
</style>
</head>
<body>
<main>
  <div class="topline"><h1 class="mark">Coint<em>OS</em></h1><div class="global-ctl"><button class="btn" id="pause-all" type="button">Pause all</button><span class="stamp" id="stamp">connecting…</span></div></div>
  <div class="strip" id="strip"></div>
  <div class="alert" id="alert"></div>
  <div class="cols">
  <div class="col-main">
  <div id="agents"></div>
  <section class="panel" id="home"><h2>Projects</h2><div class="pcards" id="pcards"></div><div id="add-project"><details class="project-form"><summary>Add or create project</summary>
        <div class="project-fields">
          <label>Action<select id="project-action"><option value="add">Add existing</option><option value="new">Create new</option></select></label>
          <label>Name <input id="project-name" placeholder="derived from folder for existing"></label>
          <label>Path <input id="project-path" placeholder="~/Projects/name"></label>
          <label>Priority <input id="project-priority" type="number" value="100"></label>
          <button id="project-submit" type="button">Add project</button>
        </div><small id="project-status" role="status" aria-live="polite"></small>
      </details></div></section>
  <section class="panel" id="project-page" hidden><a class="back" href="#/">← All projects</a>
    <div class="phead"><h2 id="pp-name"></h2><p id="pp-about"></p></div><div class="project-list" id="projects"></div>
    <h3>Pipeline</h3><div class="flow" id="flow"></div><div class="flow-foot" id="flow-foot"></div></section>
    <section class="panel"><div class="panel-heading"><h2>Work</h2>
      <div class="scout-control"><small id="scout-status" role="status" aria-live="polite"></small><button id="scout-now" type="button">Spawn scout</button></div>
    </div><div id="work"></div>
      <details class="done" id="done"><summary><h3>Done <span id="done-count"></span></h3></summary><div class="done-list" id="done-list"></div></details>
      <details class="done" id="failed"><summary><h3>Gave up <span id="failed-count"></span></h3></summary><div class="done-list" id="failed-list"></div></details>
      <div class="scout-control"><button id="clear-task-history" type="button">Clear task history</button><small id="clear-task-status" role="status" aria-live="polite"></small></div></section>
  </div>
  <aside class="col-side">
    <section class="panel machine"><h2>Machine</h2>
      <div class="scheduler-controls">
      <div class="scheduler-control"><label for="slice">GPU time slice</label>
        <select id="slice" disabled aria-describedby="slice-status">
          <option value="1">1 s</option><option value="2">2 s</option><option value="5">5 s</option>
          <option value="10">10 s</option><option value="15">15 s</option><option value="30">30 s</option>
          <option value="60">60 s</option><option value="120">120 s</option><option value="300">300 s</option>
        </select><small id="slice-status" role="status" aria-live="polite">Connecting…</small>
      </div>
      <div class="scheduler-control"><label for="chunk">Generation step</label>
        <select id="chunk" disabled aria-describedby="chunk-status">
          <option value="8">8 tokens</option><option value="16">16 tokens</option>
          <option value="32">32 tokens</option><option value="48">48 tokens</option>
          <option value="64">64 tokens</option><option value="96">96 tokens</option>
          <option value="128">128 tokens</option><option value="256">256 tokens</option>
        </select><small id="chunk-status" role="status" aria-live="polite">Connecting…</small>
      </div>
      </div><div class="machine-grid"><div id="lanes"></div><div id="memory"></div></div>
      <div id="checks"></div></section>
    <section class="panel"><h2>Recently</h2><div class="history" id="history"></div></section>
</aside>
  </div>
</main>
<div class="scrim" id="scrim" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Task details"><button class="close" id="drawer-close" type="button" aria-label="Close">×</button><div id="drawer-body"></div></aside>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const ago = t => { const s = Math.max(0, Date.now() / 1000 - t) | 0;
  return s < 120 ? s + "s" : s < 7200 ? (s / 60 | 0) + "m" : (s / 3600 | 0) + "h"; };

const short = model => model.replace(/-GGUF$/, "");

async function projectAction(action, body) {
  const response = await fetch(`/api/project-${action}`, {method: "POST", headers: {"Content-Type": "application/json"},
                                                           body: JSON.stringify(body)});
  const result = await response.json();
  if (!response.ok) throw new Error(result.error || `Project ${action} failed`);
  return result;
}

async function setProject(name, settings) {
  try { await projectAction("set", {project: name, settings}); }
  catch (error) { $("project-status").textContent = error.message; }
}
async function removeProject(name) {
  try { await projectAction("remove", {project: name}); }
  catch (error) { $("project-status").textContent = error.message; }
}
// The open project's registry settings, on its page.
function renderProjects(L) {
  const projects = (L.projects || []).filter(p => p.name === ROUTE.project);
  setHTML($("projects"), projects.length ? projects.map(p => `<div class="project-row">` +
    `<div><span class="chip">${esc(p.main_branch)}</span></div>` +
    `<div class="project-path">${esc(p.path)}</div><div class="project-controls">` +
    `<label>Priority <input type="number" value="${esc(p.priority ?? 100)}" onchange='setProject(${JSON.stringify(p.name)}, {priority:Number(this.value)})'></label>` +
    `<label><input type="checkbox" ${p.enabled === false ? "" : "checked"} onchange='setProject(${JSON.stringify(p.name)}, {enabled:this.checked})'> enabled</label>` +
    `<button type="button" onclick='confirm("Remove ${esc(p.name)} from CointOS? Its repository is left alone.") && removeProject(${JSON.stringify(p.name)})'>Remove</button></div></div>`).join("")
    : "");
}

$("project-action").addEventListener("change", event => {
  $("project-submit").textContent = event.target.value === "new" ? "Create project" : "Add project";
});
$("project-submit").addEventListener("click", async event => {
  const action = $("project-action").value, name = $("project-name").value.trim(), path = $("project-path").value.trim();
  if (action === "new" && !name) { $("project-status").textContent = "A new project needs a name."; return; }
  if (action === "add" && !path) { $("project-status").textContent = "An existing project needs its path."; return; }
  event.target.disabled = true; $("project-status").textContent = action === "new" ? "Creating…" : "Adding…";
  try {
    const body = {priority: Number($("project-priority").value)};
    if (name) body.name = name;
    if (path) body.path = path;
    await projectAction(action, body);
    $("project-name").value = ""; $("project-path").value = ""; $("project-status").textContent = "Saved";
  } catch (error) { $("project-status").textContent = error.message; }
  finally { event.target.disabled = false; }
});

// What an agent is doing right now, from its thoughts.
function phase(L, a) {
  const mine = Object.values(L.thoughts).filter(t => t.agent === a.id);
  const running = mine.find(t => t.lane !== null), queued = mine.find(t => t.lane === null);
  if (a.state === "starting") return ["starting", "Starting", `for ${ago(a.started_at)}`];
  if (running && a.state === "reading") {
    const share = Math.min(1, (running.held || 0) / Math.max(1, running.prompt));
    return ["thinking", "Reading", `${Math.round(share * 100)}% of ${running.prompt.toLocaleString()} tokens`, share];
  }
  if (running) return ["thinking", (a.live || {}).phase === "writing" ? "Writing" : "Reasoning", `for ${ago(running.since)} on ${short(running.model)} · ${running.generated} tokens so far`];
  if (queued) return ["waiting", "Waiting", `for a lane, ${ago(queued.waiting_since)}`];
  return ["tools", "Running", "its tools"];
}

// Agent cards are built once and then updated in place (the live stream updates them ten
// times a second), so animations run on, and hover and selection survive.
function setText(el, value) { if (el.textContent !== value) el.textContent = value; }
function setHTML(el, value) { if (el.dataset.html !== value) { el.dataset.html = value; el.innerHTML = value; } }

// Balance rows with the smaller rows first; each row still fills the full width.
function agentRowSizes(count, capacity) {
  if (!count) return [];
  const rows = Math.ceil(count / capacity), small = Math.floor(count / rows), larger = count % rows;
  return Array.from({length: rows}, (_, i) => small + (i >= rows - larger ? 1 : 0));
}

function renderAgents(S) {
  const agents = Object.values(S.agents).filter(a => !ROUTE.project || a.place === ROUTE.project).sort((a, b) => a.started_at - b.started_at);
  let grid = $("agents").querySelector(".agents");
  if (!agents.length) {
    setHTML($("agents"), `<div class="empty">${S.paused ? "Agents are paused. <b>cointos go</b> lets them run again."
      : "No agents right now. They start as work appears in the queues."}</div>`);
    return;
  }
  if (!grid) { $("agents").innerHTML = `<div class="agents"></div>`; $("agents").dataset.html = ""; grid = $("agents").firstChild; }
  const capacity = Number(getComputedStyle(grid).getPropertyValue("--capacity"));
  const spans = agentRowSizes(agents.length, capacity).flatMap(size => Array(size).fill(6 / size));
  const cards = new Map([...grid.children].map(card => [card.dataset.id, card]));
  agents.forEach((a, index) => {
    let card = cards.get(a.id);
    if (!card) {
      card = document.createElement("article");
      card.dataset.id = a.id;
      card.innerHTML = `<div class="mark"></div><div class="role"></div><div class="stats"><b></b><span></span><span></span></div><div class="work"></div>` +
        `<div class="sum"></div><div class="meta"></div><div class="track"></div><div class="live"><div></div></div><div class="foot"><div class="now"></div><div class="ctl"><button type="button" class="btn" data-act="pause-agent">Pause</button>` +
        `<button type="button" class="btn" data-act="cancel-item">Cancel task</button></div></div><div class="progress"><span></span></div>`;
    }
    if (card.className !== `agent r-${a.role}`) card.className = `agent r-${a.role}`;
    card.dataset.key = a.task;
    card.dataset.agent = a.id;
    const cancellable = !!S.queue?.[S.tasks?.[a.task]?.record || ""] || !!S.queue?.[S.tasks?.[S.tasks?.[a.task]?.worker]?.record || ""];
    card.querySelector('[data-act="cancel-item"]').hidden = !cancellable;
    if (grid.children[index] !== card) grid.insertBefore(card, grid.children[index] || null);
    cards.delete(a.id);
    card.style.gridColumn = `span ${spans[index]}`;
    const [kind, label, detail, share] = phase(S, a), q = selector => card.querySelector(selector);
    const mark = q(".mark");
    if (mark.className !== `mark ${kind}`) mark.className = `mark ${kind}`;
    const [uptime, written, rate] = q(".stats").children;
    setText(uptime, ago(a.started_at));
    setText(written, `${a.generated.toLocaleString()} tok`);
    setText(rate, a.rate && a.state === "thinking" && kind === "thinking" && share === undefined ? `${a.rate.toFixed(1)} tok/s` : "idle");
    const task = S.tasks?.[a.task];
    setHTML(q(".role"), `${esc(a.role)} <em>${esc(ROLE_VERB[a.role] || "working")} · ${esc(a.place)}` +
      `${(task?.stage || a.stage) ? ` · ${esc(stageName(task?.stage || a.stage))}` : ""}</em>`);
    const step = FLOW?.items.get(a.role === "integrator" ? task?.worker : a.task)?.step;
    setHTML(q(".track"), trackHTML(step, a.role));
    const trackClass = step ? "track" : "track upkeep";
    if (q(".track").className !== trackClass) q(".track").className = trackClass;
    const n = named(a.title, a.place);
    setText(q(".sum"), summaryOf(S, a.task) || "");
    setHTML(q(".work"), `${esc(n.head)}${n.context ? `<small>${esc(n.context)}</small>` : ""}`);
    const effort = Object.values(S.thoughts).find(t => t.agent === a.id && t.reasoning_effort)?.reasoning_effort
      || task?.reasoning_effort || a.reasoning_effort;
    setText(q(".meta"), `${a.id}${effort ? ` · reasoning ${effort}` : ""}`);
    const live = a.live || {};
    const words = (live.reasoning ? `<i>${esc(live.reasoning)}</i>` : "") + (live.content ? `<p>${esc(live.content)}</p>` : "") +
      ((kind === "tools" || !(live.reasoning || live.content)) && a.doing ? `<p class="tool">⚙ ${esc(a.doing)}</p>` : "");
    setHTML(q(".live > div"), words);
    setHTML(q(".now"), `<b>${label}</b> ${esc(detail)}`);
    const bar = q(".progress");
    bar.style.display = share === undefined ? "none" : "";
    if (share !== undefined) q(".progress span").style.width = `${(share * 100).toFixed(1)}%`;
  });
  cards.forEach(card => card.remove());
}

// The pipeline a work item moves through, left to right. Blocked items wait before Ready.
const FLOW_STEPS = [["blocked", "Blocked", "waiting on others"], ["ready", "Ready", "queued for a worker"],
  ["building", "Building", "a worker has it"], ["review", "Review", "awaiting the integrator"],
  ["integrating", "Integrating", "being checked and landed"], ["landed", "Landed", "on main"]];
const TRACK = [["ready", "Queued"], ["building", "Build"], ["review", "Review"], ["integrating", "Integrate"], ["landed", "Landed"]];
const ROLE_VERB = {worker: "building", integrator: "reviewing & landing", manager: "planning", steward: "tidying loose ends",
  gardener: "gardening knowledge", "tree-auditor": "auditing knowledge", "test-auditor": "auditing tests", operator: "operating"};
const KIND_LABEL = {steward: "loose ends", garden: "garden", "tree-audit": "tree audit", "test-audit": "test audit",
  decompose: "decompose", breakdown: "breakdown", operator: "operator"};
const stem = name => name.split("/").pop().replace(/\.[^.]+$/, "");
const pretty = s => String(s || "").replace(/-/g, " ");
// A work item's slug as a headline plus its context: "elastic-rtl-task-5-test-contract-fix-s6" in pigen
// becomes "Test Contract Fix §6" with context "Pigen · Elastic RTL Task 5".
const ACRONYMS = new Set(["rtl", "kv", "api", "cli", "gpu", "cpu", "io", "fsm", "fifo", "ci", "ui", "url", "kt", "os", "llm"]);
const WORDS = {impl: "Implementation", param: "Parameter", params: "Parameters", deps: "Dependencies", init: "Initialisation"};
const word = w => /^s\d+$/.test(w) ? "§" + w.slice(1) : ACRONYMS.has(w.toLowerCase()) ? w.toUpperCase()
  : WORDS[w.toLowerCase()] || w[0].toUpperCase() + w.slice(1);
function named(slug, project) {
  const parts = String(slug || "").split("-").filter(Boolean);
  const i = parts.findIndex((w, j) => w === "task" && /^\d+$/.test(parts[j + 1] || ""));
  const rest = i >= 0 ? parts.slice(i + 2) : parts, parent = i >= 0 && rest.length ? parts.slice(0, i + 2) : [];
  return {head: (rest.length ? rest : parts).map(word).join(" "),
          context: [project ? word(project) : "", parent.map(word).join(" ")].filter(Boolean).join(" · ")};
}
const KIND_NAME = {item: "Worker task", queued: "Worker task", integrate: "Integration review", command: "Command"};
const stageName = s => s ? s.split("-").map(word).join(" ") : "";

// The dependencies of a queue record that have not landed yet.
function unmet(L, r) {
  const records = Object.values(L.queue || {});
  return (r.depends || []).filter(name => !records.some(d => d.project === r.project &&
    d.status === "done" && (d.item === name || stem(d.item) === stem(name))));
}

// Every work item (queue record and/or item task) with the pipeline step it is at now.
let FLOW = null;
function computeFlow(L) {
  const items = new Map();
  for (const r of Object.values(L.queue || {})) {
    if (r.replaced_by) continue;
    const key = `${r.project}:${r.item}`;
    items.set(key, {key, project: r.project, title: r.item, stage: r.stage, record: r});
  }
  for (const t of Object.values(L.tasks)) {
    if (t.kind !== "item" || t.replaced_by || t.cancelled) continue;
    const it = items.get(t.id) || {key: t.id, project: t.place, title: t.title};
    items.set(t.id, {...it, stage: t.stage || it.stage, task: t});
  }
  const integrating = new Map(Object.values(L.tasks).filter(t => t.kind === "integrate" && t.status === "running").map(t => [t.worker, t]));
  for (const it of items.values()) {
    const t = it.task, r = it.record;
    it.integrator = integrating.get(it.key);
    it.blockers = r ? unmet(L, r) : [];
    it.step = r?.status === "done" ? "landed"
      : it.integrator ? "integrating"
      : t?.status === "review" ? "review"
      : t?.status === "running" ? "building"
      : t?.status === "failed" && (!r || r.status === "done") ? "failed"
      : t?.status === "done" && !r ? "landed"
      : it.blockers.length || r?.status === "blocked" ? "blocked" : "ready";
    it.updated = Math.max(t?.updated_at || 0, t?.receipt?.at || 0);
    it.priority = r?.priority ?? 999;
  }
  const upkeep = Object.values(L.tasks).filter(t => t.kind !== "item" && t.kind !== "integrate" &&
    (t.status === "running" || t.status === "waiting"));
  return {items, upkeep};
}

// The manager's plain-language `Summary:` for a task, from its queue record (an integration uses its worker's).
function summaryOf(L, key) {
  const t = L?.tasks?.[key], records = L?.queue || {};
  const record = records[key] || records[t?.record] || records[L?.tasks?.[t?.worker]?.record] || records[t?.worker];
  return record?.summary || "";
}
function chip(key, title, sub, cls = "", summary = "") {
  return `<button type="button" class="tchip ${cls}" data-key="${esc(key)}" title="${esc(summary || title)}"><span class="t">${esc(title)}</span>` +
    `${summary ? `<span class="sum">${esc(summary)}</span>` : ""}` +
    `${sub ? `<small>${esc(sub)}</small>` : ""}</button>`;
}

function renderFlow(L) {
  const by = Object.fromEntries([...FLOW_STEPS, ["failed"]].map(([s]) => [s, []]));
  for (const it of FLOW.items.values()) if (it.project === ROUTE.project) by[it.step].push(it);
  by.landed.sort((a, b) => b.updated - a.updated);
  for (const s of ["blocked", "ready"]) by[s].sort((a, b) => a.priority - b.priority);
  const LIMIT = 6;
  const sub = (it, s) => [named(it.title).context, stageName(it.stage),
    s === "blocked" && it.blockers.length ? `needs ${it.blockers.map(b => named(b).head).join(", ")}` : "",
    s === "building" && it.task?.agent ? it.task.agent : "",
    s === "integrating" ? it.integrator.agent : "",
    s === "landed" && it.updated ? `${ago(it.updated)} ago` : ""].filter(Boolean).join(" · ");
  setHTML($("flow"), FLOW_STEPS.map(([s, label, hint], i) => {
    const list = by[s], shown = list.slice(0, LIMIT);
    const live = s === "building" || s === "integrating";
    const step = `<div class="step s-${s}${list.length ? "" : " empty-step"}"><header><span>${label}<small>${hint}</small></span><b>${list.length}</b></header>` +
      `<div class="chips">${shown.map(it => chip(it.key, named(it.title).head, sub(it, s),
        live ? "live" : s === "blocked" ? "held" : "", it.record?.summary)).join("")}` +
      `${list.length > LIMIT ? `<button type="button" class="tchip more" data-step="${s}">+${list.length - LIMIT} more</button>` : ""}</div></div>`;
    // Blocked feeds Ready; each arrow marches while the step after it holds live work.
    const next = FLOW_STEPS[i + 1]?.[0];
    const arrow = next ? `<div class="arrow${(next === "building" || next === "integrating") && by[next].length ? " moving" : ""}"></div>` : "";
    return step + arrow;
  }).join(""));
  const upkeep = FLOW.upkeep.filter(t => t.place === ROUTE.project).map(t => chip(t.id, `${KIND_LABEL[t.kind] || t.kind}${t.place ? " · " + t.place : ""}`,
    `${t.role} · ${t.status === "running" ? "running" : "waiting"}`, t.status === "running" ? "live" : ""));
  const failed = by.failed.sort((a, b) => b.updated - a.updated)
    .map(it => chip(it.key, named(it.title).head, [named(it.title, it.project).context, stageName(it.stage)].filter(Boolean).join(" · "), "held"));
  setHTML($("flow-foot"), (upkeep.length ? `<div class="group"><h3>Upkeep</h3>${upkeep.join("")}</div>` : "") +
    (failed.length ? `<div class="group"><h3>Gave up · ${failed.length}</h3>${failed.slice(0, 8).join("")}</div>` : ""));
}

// One card per registered project: what it is, how its work is spread along the pipeline, who is on it.

    const items = [...FLOW.items.values()].filter(it => it.project === p.name);
    const count = s => items.filter(it => it.step === s).length;

      (total ? `<div class="pbar">${steps.filter(count).map(s => `<span class="s-${s}" style="flex:${s === "landed" ? Math.min(count(s), Math.max(3, total - count(s))) : count(s)}" ` +
        `title="${FLOW_STEPS.find(([x]) => x === s)[1]}: ${count(s)}">${count(s)}</span>`).join("")}</div>` +
        `<div class="pkey">${steps.filter(count).map(s => `<span><b>${count(s)}</b> ${FLOW_STEPS.find(([x]) => x === s)[1].toLowerCase()}</span>`).join("")}` +

function trackHTML(step, role) {
  if (!step) return `◆ upkeep: ${esc(ROLE_VERB[role] || role)}`;
  if (step === "blocked" || step === "failed") return `<span class="here">${step === "failed" ? "gave up" : "blocked"}</span>`;
  const at = TRACK.findIndex(([s]) => s === step);
  return TRACK.map(([s, label], i) => `<span data-s="${s}" class="${i < at ? "past" : i === at ? "here" : ""}">${label}</span>`).join("<i></i>");
}

// The detail drawer, kept open across updates and re-rendered from fresh data.
let SELECTED = null;
// The address's hash holds the page and open task: `#/` home, `#/pigen` a project, `#/pigen/pigen:item` with a task open.
const ROUTE = {project: null};
function writeRoute() { history.replaceState(null, "", `#/${encodeURIComponent(ROUTE.project || "")}` + (SELECTED ? "/" + encodeURIComponent(SELECTED) : "")); }
function readRoute() {
  const [, project = "", task = ""] = location.hash.replace(/^#/, "").split("/");
  ROUTE.project = decodeURIComponent(project) || null; SELECTED = decodeURIComponent(task) || null;
  $("drawer").hidden = $("scrim").hidden = !SELECTED;
  if (LAST.L) render(LAST.L);
}
function openDetail(key) { SELECTED = key; writeRoute(); $("drawer").hidden = $("scrim").hidden = false; renderDrawer(LAST.L); }
function closeDetail() { SELECTED = null; writeRoute(); $("drawer").hidden = $("scrim").hidden = true; }
window.addEventListener("hashchange", readRoute);
$("drawer-close").onclick = closeDetail; $("scrim").onclick = closeDetail;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDetail(); });
document.addEventListener("click", e => {
  const more = e.target.closest("[data-step]");

// What the user can do to this task right now, as buttons that call the daemon's control API.
function actionsHTML(L, t, it, r) {
  const b = (act, label, data = {}, cls = "") => `<button type="button" class="btn ${cls}" data-act="${act}" ` +
    Object.entries(data).map(([k, v]) => `data-${k}="${esc(v)}"`).join(" ") + `>${label}</button>`;
  const key = r ? `${r.project}:${r.item}` : null, out = [];
  if (t?.agent && L.agents[t.agent]) out.push(b("pause-agent", "Pause run", {agent: t.agent}));
  if (t?.admission_hold && t.status === "waiting") out.push(b("resume-task", "Resume", {task: t.id}));
  if (r && r.status !== "done") {
    out.push(r.held_by ? b("unhold", "Release hold", {item: key}) : b("hold", "Hold", {item: key}));
    out.push(`<span class="sep"></span>` + ["top", "up", "down", "bottom"].map(to =>
      b("move", {top: "⇈ Top", up: "↑ Up", down: "↓ Down", bottom: "⇊ Bottom"}[to], {item: key, to})).join(""));
    out.push(`<span class="sep"></span>` + b("cancel-item", "Cancel task", {item: key}, "danger"));
  }
  if (t && (t.status === "waiting" || t.status === "running")) out.push(`<span class="sep"></span><label>Reasoning <select data-act="reasoning" data-task="${esc(t.id)}">` +
    ["low", "medium", "xhigh"].map(e => `<option${e === t.reasoning_effort ? " selected" : ""}>${e}</option>`).join("") + `</select></label>`);
  return out.length ? `<div class="actions">${out.join("")}</div>` : "";
}

    ["Role", t?.role], ["Task status", t?.status], ["Queue status", r?.status], ["Priority", r?.priority],
    ["Agent", agent ? `${agent.id} · ${agent.state}${agent.doing ? " · " + agent.doing : ""}` : t?.agent],

    ["Depends on", r?.depends?.length ? r.depends.map(d => esc(d) + (it.blockers.includes(d) ? " ⏳" : " ✓")).join(", ") : null, true],
    ["Problem", L.dependency_problems?.[SELECTED]], ["Held", t?.admission_hold || r?.held_by],
    ["Reviews worker", t?.worker ? link(t.worker) : null, true],
    ["Integrations", integrations.length ? integrations.map(x => `${link(x.id)} (${esc(x.status)})`).join(", ") : null, true],
    ["Replaced by", t?.replaced_by ? `${t.replaced_by.map(link).join(", ")} · ${esc(t.replacement_reason)}` : null, true],
    ["Accepted", t?.acceptance ? `via ${t.acceptance.via} · ${t.acceptance.commit.slice(0, 12)}` : null],
    ["Rejections", t?.rejections || null], ["Fresh recoveries", t?.fresh_retries || null],
    ["Branch", t?.branch], ["Worktree", t?.worktree], ["Commit", r?.commit],

  const receipt = t?.receipt;

    : {head: stageName(KIND_LABEL[t.kind] || t.kind), context: word(t.place || "")};
  setHTML($("drawer-body"),

    (receipt ? block(`Receipt · ${esc(receipt.disposition)}${receipt.run ? " · " + esc(receipt.run) : ""}${receipt.at ? " · " + ago(receipt.at) + " ago" : ""}`,
      receipt.summary + (receipt.evidence ? `\n\nevidence: ${JSON.stringify(receipt.evidence)}` : "")) : "") +
    block("Note", t?.note) + block("Result", t?.result !== receipt?.summary ? t?.result : "") +

}

function renderWork(L) {
  const groups = [["running", "In progress"], ["review", "Waiting for the integrator"], ["waiting", "Up next"]];
  const here = place => !ROUTE.project || place === ROUTE.project;
  const tasks = Object.values(L.tasks).filter(t => here(t.place)).sort((a, b) => b.updated_at - a.updated_at);
  const records = Object.values(L.queue || {}).filter(r => here(r.project));
  const queued = records.filter(r => r.status !== "done" && !r.replaced_by &&
    (!L.tasks[`${r.project}:${r.item}`] || L.tasks[`${r.project}:${r.item}`].status === "waiting" ||
      (r.status === "blocked" && L.tasks[`${r.project}:${r.item}`].status === "done")))
    .sort((a, b) => a.priority - b.priority);
  const queuedIds = new Set(queued.map(r => `${r.project}:${r.item}`));
  const queueRows = queued.map(r => {
    const needed = unmet(L, r);
    const problem = L.dependency_problems?.[`${r.project}:${r.item}`];
    const status = problem || (needed.length ? `blocked (depends on ${needed.join(", ")})`
      : r.status === "blocked" ? "blocked" : "waiting");
    return `<div class="row ${needed.length || r.status === "blocked" ? "failed" : "waiting"}" data-key="${esc(r.project + ":" + r.item)}"><div class="bar"></div>` +
      `<div class="who">${esc(named(r.item).head)} <span class="ctx">${esc(named(r.item, r.project).context)}</span></div>` +
      `<div class="state">Status: ${esc(status)}<span class="move"><button type="button" class="btn" data-act="move" data-to="up" data-item="${esc(r.project + ":" + r.item)}" title="Move up">↑</button>` +
      `<button type="button" class="btn" data-act="move" data-to="down" data-item="${esc(r.project + ":" + r.item)}" title="Move down">↓</button></span></div>` +
      `<div class="meta clamp">${esc(r.kind === "command" ? "Command" : "Worker task")}${r.stage ? ` · ${esc(r.stage)}` : ""}` +
      `${r.depends?.length ? ` · Depends on: ${esc(r.depends.join(", "))}` : ""}` +
      `${r.report ? ` · ${esc(r.report)}` : ""}</div></div>`;
  }).join("");
  const taskLabel = t => t.kind === "steward" ? "System: loose ends" : t.kind === "item" || t.kind === "integrate"
    ? `${named(t.title).head}${t.kind === "integrate" ? " (review)" : ""}` : `${stageName(KIND_LABEL[t.kind] || t.kind)}`;
  const taskContext = t => named(t.title, t.place).context;
  const rows = (status, some) => some.map(t => `<div class="row ${status}" data-key="${esc(t.id)}"><div class="bar"></div>` +
    `<div class="who">${esc(taskLabel(t))} <span class="ctx">${esc(taskContext(t))}</span></div>` +
    `<div class="state">${esc(t.role)} · run ${t.runs} · ${ago(t.updated_at)} ago</div>` +
    `<div class="meta one" title="${esc(status === "done" && t.result ? t.result : t.note || "")}">${esc(status === "done" && t.result ? t.result : t.note || "")}</div>` +
    `${t.replaced_by ? `<div class="meta">Replaced by: ${esc(t.replaced_by.join(", "))} · ${esc(t.replacement_reason)}</div>` : ""}` +
    `${t.acceptance ? `<div class="meta">Accepted via ${esc(t.acceptance.via)} · ${esc(t.acceptance.commit.slice(0, 12))}</div>` : ""}` +
    `${t.fresh_retries ? `<div class="meta">Fresh recoveries: ${esc(t.fresh_retries)}</div>` : ""}</div>`).join("");
  setHTML($("work"), groups.map(([status, title]) => {
    const queueSection = status === "review" ? `<h3>Queue</h3>${queueRows || '<p class="muted">No queued tasks.</p>'}` : "";
    const some = tasks.filter(t => t.status === status && !queuedIds.has(t.id));
    return queueSection + (some.length ? `<h3>${title}</h3>` + rows(status, some) : "");
  }).join(""));
  const done = tasks.filter(t => t.status === "done");
  const failed = tasks.filter(t => t.status === "failed" && !t.cancelled);
  $("done").style.display = done.length ? "" : "none";
  setText($("done-count"), `· ${done.length}`);
  setHTML($("done-list"), rows("done", done));
  $("failed").style.display = failed.length ? "" : "none";
  setText($("failed-count"), `· ${failed.length}`);
  setHTML($("failed-list"), rows("failed", failed));
  $("clear-task-history").disabled = CLEARING || !(done.length + failed.length);
  const scouting = tasks.some(t => t.kind === "steward" && (t.status === "waiting" || t.status === "running"));
  $("scout-now").disabled = scouting || L.paused || SCOUTING;
  if (!SCOUTING) $("scout-status").textContent = scouting ? "Scout scheduled" : L.paused ? "Paused" : "";
}

// The control layer: every button names an action; each runs one daemon API call and reports in a toast.
let toastTimer;
function toast(text, bad = false) {
  const el = $("toast"); el.textContent = text; el.className = bad ? "toast bad" : "toast"; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.hidden = true, bad ? 7000 : 3500);
}
async function api(action, body) {
  const response = await fetch(`/api/${action}`, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const result = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(result.error || `${action} failed`);
  return result;
}
const CONTROLS = {
  "pause-agent": d => [`Pause ${d.agent}? Its task is held until you resume it.`, "kill-agent", {agent: d.agent}, `Paused ${d.agent}`],
  "resume-task": d => [null, "resume-task", {task: d.task}, "Released; it will be scheduled again"],
  "hold": d => [null, "hold", {item: d.item}, "Held"],
  "unhold": d => [null, "unhold", {item: d.item}, "Hold released"],
  "move": d => [null, "move", {item: d.item, to: d.to}, `Moved ${d.to}`],
  "cancel-item": d => {
    const reason = prompt(`Cancel ${d.item} for good? Its run stops and it leaves the queue.\nReason:`);
    return reason === null ? null : [false, "cancel", {items: [d.item], reason: reason.trim() || "cancelled from the dashboard"}, "Cancelled"];
  },
};
document.addEventListener("click", async e => {
  const button = e.target.closest("button[data-act]");
  if (!button) return;
  e.stopPropagation(); e.preventDefault();
  const card = button.closest(".agent"), data = {...button.dataset};
  if (card) { data.agent ??= card.dataset.agent; data.item ??= (LAST.L.tasks[card.dataset.key]?.record || LAST.L.tasks[LAST.L.tasks[card.dataset.key]?.worker]?.record); }
  const plan = CONTROLS[data.act]?.(data);
  if (!plan) return;
  const [question, action, body, done] = plan;
  if (question && !confirm(question)) return;
  button.disabled = true;
  try { await api(action, body); toast(done); }
  catch (error) { toast(error.message, true); }
  finally { button.disabled = false; }
}, true);
document.addEventListener("change", async e => {
  const select = e.target.closest('select[data-act="reasoning"]');
  if (!select) return;
  try { await api("reasoning", {task: select.dataset.task, effort: select.value}); toast(`Reasoning ${select.value} from the next reply`); }
  catch (error) { toast(error.message, true); }
});
$("pause-all").addEventListener("click", async () => {
  const paused = LAST.paused;
  if (!paused && !confirm("Pause all agents? Running work returns to waiting.")) return;
  try { await api(paused ? "go" : "stop", {}); toast(paused ? "Resumed" : "Paused all agents"); }
  catch (error) { toast(error.message, true); }
});

const MEMORY_COLOURS = [["Operating System", "#28262b"], ["Model weights", "#9f3b52"], ["KV-cache", "#e9687e"],
                        ["Saved contexts", "#ec98a5"], ["Free", "#ece3e0"]];

function renderMemory(M) {
  // The operating system in ink, CointOS's parts in steps of the site's rose (validated as an
  // ordinal ramp), free memory as pale paper; clockwise from midnight. Built once, then updated.
  const m = M.memory || {};
  if (m.physical_gb === undefined) return;
  const gib = gb => gb * 1e9 / 2 ** 30;  // shown in GiB (written "GB"), as RAM is sized
  const loaded = Object.entries(M.models).filter(([, model]) => model.up).map(([name]) => M.model_memory[name]);
  const weights = loaded.reduce((n, x) => n + x.weights_gb, 0);
  const kv = loaded.reduce((n, x) => n + x.memory_gb - x.weights_gb, 0);
  const saved = M.saved_bytes / 2 ** 30, physical = gib(m.physical_gb);
  // MemAvailable includes reclaimable model-weight pages, so it cannot itself be the chart's Free
  // segment without counting those weights twice. Use it to find real non-reclaimable use, remove
  // CointOS's KV and snapshots, then make Free the remainder of the physical partition.
  const used = Math.max(0, physical - gib(m.available_gb));
  const system = Math.max(0, used - kv - saved);
  const free = Math.max(0, physical - system - weights - kv - saved);
  const values = [system, weights, kv, saved, free];
  MEMORY_PARTS = MEMORY_COLOURS.map(([name, colour], i) => [name, values[i], colour]);
  if (!$("membar")) {
    $("memory").innerHTML = `<h3>Memory</h3><div class="memhead"><b id="mem-value"></b><span id="mem-label"></span></div>` +
      `<div class="membar" id="membar" onmouseleave="focusPart(-1)">` +
      MEMORY_COLOURS.map(([, colour], i) => `<span class="seg" data-i="${i}" style="background:${colour}" onmouseenter="focusPart(${i})"></span>`).join("") +
      `</div><div class="legend">` + MEMORY_COLOURS.map(([name, colour], i) =>
        `<div class="item" data-i="${i}" onmouseenter="focusPart(${i})" onmouseleave="focusPart(-1)"><i style="background:${colour}"></i>` +
        `<span>${name}</span><b></b><em></em></div>`).join("") + `</div><div class="memfacts" id="memfacts"></div>`;
  }
  const total = values.reduce((n, v) => n + v, 0);
  document.querySelectorAll("#membar .seg").forEach((seg, i) => seg.style.width = `${total ? values[i] / total * 100 : 0}%`);
  const inUse = total - free;
  if ($("tile-mem")) {
    setText($("tile-mem").querySelector("b"), `${total ? Math.round(inUse / total * 100) : 0}%`);
    setText($("tile-mem").querySelector("small"), `${inUse.toFixed(0)} of ${total.toFixed(0)} GB`);
    $("tile-mem").querySelector(".meter i").style.width = `${total ? inUse / total * 100 : 0}%`;
  }
  document.querySelectorAll(".legend .item").forEach((item, i) => {
    setText(item.querySelector("b"), `${values[i].toFixed(1)} GB`);
    setText(item.querySelector("em"), `${total ? Math.round(values[i] / total * 100) : 0}%`);
  });
  setHTML($("memfacts"), `pressure ${m.psi} · swap ${m.swap_gb} GB` +
    (M.guard && M.guard.blocked ? ` · <b>background waiting for memory</b>` : "") + (M.guard && M.guard.killed ? ` · <b>work model killed</b>` : ""));
  focusPart(FOCUSED);
}

let MEMORY_PARTS = [], FOCUSED = -1;
function focusPart(i) {
  FOCUSED = i;
  if (!$("membar")) return;
  document.querySelectorAll("#membar .seg").forEach(seg => seg.style.opacity = i < 0 || +seg.dataset.i === i ? 1 : .35);
  document.querySelectorAll(".legend .item").forEach(item => item.classList.toggle("on", +item.dataset.i === i));
  const total = MEMORY_PARTS.reduce((n, p) => n + p[1], 0);
  const inUse = total - (MEMORY_PARTS[4]?.[1] || 0);
  setText($("mem-value"), i < 0 ? `${inUse.toFixed(0)} GB` : `${MEMORY_PARTS[i][1].toFixed(1)} GB`);
  setText($("mem-label"), i < 0 ? `in use of ${total.toFixed(0)} GB` : MEMORY_PARTS[i][0].toLowerCase());
}

function renderChecks(L) {
  const failing = L.checks.filter(c => !c.ok);
  $("checks").innerHTML = !L.checks.length ? "" : failing.length
    ? failing.map(c => `<div class="check no"><b>${esc(c.name)}</b> ${esc(c.detail)}</div>`).join("")
    : `<div class="check ok">✓ All ${L.checks.length} self-checks pass</div>`;
}

function sentence(h) {
  const lane = h.model ? `${short(h.model)} lane ${h.lane}` : `lane ${h.lane}`;
  switch (h.event) {
    case "agent started": return `${h.agent} started on ${short_task(h.task)} (run ${h.run})`;
    case "agent ended": return `${h.agent} ended: ${h.reason}`;
    case "agent adopted": return `${h.agent} carried on through a daemon restart`;
    case "task created": return `new task: ${short_task(h.task)}`;
    case "receipt": return `${short_task(h.task)} finished: ${h.disposition}`;
    case "switch": return `${lane}: ${h.out ? short_task(h.out) : "empty"} → ${short_task(h.into)}` +
      (h.restored ? ` (restored ${h.restored.toLocaleString()} tokens)` : " (cold)") + (h.saved ? ", saved the outgoing" : "");
    case "shared prefix saved": return `shared start saved: ${h.tokens.toLocaleString()} tokens`;
    case "snapshot forgotten": return `forgot a snapshot of ${short_task(h.owner)}: ${h.reason}`;
    case "saved on stop": return `${lane}: saved ${short_task(h.owner)} as the daemon stopped`;
    case "snapshots moved to disk for shutdown": return `moved ${h.count} saved contexts to disk for shutdown`;
    case "model up": return `${short(h.model)} is up`;
    case "viewer": return `viewer ${h.slot} now shows ${h.agent}`;
    case "alert": return h.text;
    default: {
      const {at, event, ...rest} = h;
      return `${event}${Object.keys(rest).length ? ": " + Object.entries(rest).map(([k, v]) => `${k} ${typeof v === "object" ? JSON.stringify(v) : v}`).join(", ") : ""}`;
    }
  }
}

const schedulerControls = [
  {id: "slice", key: "slice_seconds", unit: "s", saving: false, error: ""},
  {id: "chunk", key: "chunk_tokens", unit: "tokens", saving: false, error: ""}
];
function renderScheduler(L) {
  for (const control of schedulerControls) {
    const input = $(control.id), value = L.scheduler?.[control.key];
    if (value === undefined) continue;
    if (![...input.options].some(o => Number(o.value) === value))
      input.add(new Option(`${value} ${control.unit}`, String(value)));
    if (!control.saving && document.activeElement !== input) input.value = String(value);
    input.disabled = control.saving;
    $(control.id + "-status").textContent = control.saving ? "Saving…" :
      control.error || L.config_error || `${value} ${control.unit} active · changes apply live`;
  }
}
for (const control of schedulerControls) $(control.id).addEventListener("change", async event => {
  control.saving = true;
  control.error = "";
  event.target.disabled = true;
  const status = $(control.id + "-status");
  status.textContent = "Saving…";
  try {
    const response = await fetch("/api/scheduler", {method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({[control.key]: Number(event.target.value)})});
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || "Could not save scheduler setting");
    status.textContent = `${result[control.key]} ${control.unit} active · changes apply live`;
  } catch (error) {
    control.error = error.message;
    status.textContent = control.error;
  } finally {
    control.saving = false;
    event.target.disabled = false;
    event.target.blur();
  }
});

function render(L) {
  const agents = Object.values(L.agents), failing = L.checks.filter(c => !c.ok);
  const count = s => Object.values(L.tasks).filter(t => t.status === s).length;
  const thinking = agents.filter(a => a.state === "thinking").length;
  $("stamp").textContent = "updated " + new Date(L.updated_at * 1000).toLocaleTimeString();
  if (!$("tile-mem")) $("strip").innerHTML = ["state", "agents", "lanes", "queue", "done", "mem", "checks"].map(id =>
    `<div class="tile" id="tile-${id}"><span></span><b></b><small></small>${id === "mem" ? `<div class="meter"><i></i></div>` : ""}</div>`).join("");
  const tile = (id, label, value, note, kind = "") => {
    const el = $(`tile-${id}`);
    if (el.className !== `tile ${kind}`.trim()) el.className = `tile ${kind}`.trim();
    setText(el.querySelector("span"), label); setText(el.querySelector("b"), String(value)); setText(el.querySelector("small"), note);
  };
  const held = L.lanes.filter(l => L.thoughts[l.holder]).length;
  tile("state", "CointOS", L.paused ? "Paused" : "Running", L.paused ? "cointos go resumes" : "autonomy on", L.paused ? "bad" : "dark");
  tile("agents", "Agents", agents.length, `${thinking} thinking now`);
  tile("lanes", "GPU lanes", `${held}/${L.lanes.length}`, "held by agents");
  tile("queue", "Up next", count("waiting"), `${count("review")} awaiting integrator`);
  tile("done", "Done", count("done"), `${count("failed")} gave up`);
  setText($("tile-mem").querySelector("span"), "Memory");
  tile("checks", "Self-checks", failing.length ? `${failing.length} red` : "✓", failing.length ? failing[0].name : `all ${L.checks.length} pass`, failing.length ? "bad" : "");
  $("alert").innerHTML = failing.map(c => esc(c.name + ": " + c.detail)).join("<br>");
  LAST = {paused: L.paused, guard: L.guard, tasks: L.tasks, L};
  setText($("pause-all"), L.paused ? "Resume agents" : "Pause all");
  FLOW = computeFlow(L);
  $("home").hidden = !!ROUTE.project; $("project-page").hidden = !ROUTE.project;
  document.querySelector(".cols").classList.toggle("wide", !!ROUTE.project);
  if (ROUTE.project) renderProjectPage(L); else renderHome(L);
  renderAgents(L);
  renderWork(L);
  renderProjects(L);
  renderMachine(L);
  renderScheduler(L);
  renderChecks(L);
  renderDrawer(L);
  $("history").innerHTML = L.history.slice(-60).reverse().map(h =>
    `<div class="${h.event === "alert" ? "alert-line" : ""}"><span class="when">${new Date(h.at * 1000).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"})}</span>` +
    `<span class="what">${esc(sentence(h))}</span></div>`).join("");
}

let LAST = {paused: false, guard: {}};
readRoute();
async function poll() {
  try { render(await (await fetch("/api/ledger", {cache: "no-store"})).json()); }
  catch (e) { $("stamp").textContent = "daemon unreachable"; }
  setTimeout(poll, 1000);
}
poll();
// Agent cards and memory, ten times a second.
new EventSource("/api/live").onmessage = event => {
  const F = JSON.parse(event.data);
  renderAgents({...F, tasks: LAST.tasks, paused: LAST.paused});
  renderMemory({...F, guard: LAST.guard});
};
</script>
