// Each control gives [arm, action, body, done, after]: with arm set, the first click only arms the button
// (showing arm as its label) and a second click within a few seconds runs it.
const CONTROLS = {
  "go": () => [null, "go", {}, "Resumed: agents start as work is available"],
  "pause-agent": d => [null, "kill-agent", {agent: d.agent}, `Paused ${d.agent}; its task waits until you resume it`],
  "resume-task": d => [null, "resume-task", {task: d.task}, "Released; it will be scheduled again"],
  "hold": d => [null, "hold", {item: d.item}, "Held"],
  "unhold": d => [null, "unhold", {item: d.item}, "Hold released"],
  "move": d => [null, "move", {item: d.item, to: d.to}, `Moved ${d.to}`],
  "cancel-item": d => ["Really cancel?", "cancel", {items: [d.item], reason: "cancelled from the dashboard"}, "Cancelled"],
  "reasoning": d => [null, "reasoning", {task: d.task, effort: d.effort}, `Reasoning ${EFFORTS.find(([e]) => e === d.effort)?.[1].toLowerCase()} from its next reply`],
  "project-enable": d => [null, "project-set", {project: d.project, settings: {enabled: d.on === "true"}},
    d.on === "true" ? `${word(d.project)} enabled` : `${word(d.project)} disabled: its agents stop and nothing new starts there`],
  "project-priority": d => [null, "project-set", {project: d.project, settings: {priority: Number(d.priority)}}, `${word(d.project)} priority set`],
  "project-remove": d => ["Really remove?", "project-remove", {project: d.project}, `Removed ${word(d.project)}; its repository is left alone`,
    () => { location.hash = "#/"; }],
  "message": d => messageSheet(d.item, d.quote),
  "budget": d => budgetSheet(d.item),
  "revise": d => reviseSheet(d.item),
};
// Arming: the first click swaps the label and fills the button; it disarms itself after a few seconds.
function arm(button, label) {
  if (button.dataset.armed !== undefined) { disarm(button); return true; }
  button.dataset.armed = button.innerHTML;
  button.classList.add("armed"); button.textContent = label;
  button.armTimer = setTimeout(() => disarm(button), 4000);
  return false;
}
function disarm(button) {
  if (button.dataset.armed === undefined) return;
  clearTimeout(button.armTimer); button.innerHTML = button.dataset.armed; delete button.dataset.armed; button.classList.remove("armed");
}
document.addEventListener("click", async e => {
  const button = e.target.closest("button[data-act]");
  if (!button) return;
  e.stopPropagation(); e.preventDefault();
  if (button.getAttribute("aria-pressed") === "true") return;  // already the current choice
  const card = button.closest(".agent"), data = {...button.dataset};
  if (card) { data.agent ??= card.dataset.agent; data.item ??= card.dataset.key; }  // controls name the task
  const plan = CONTROLS[data.act]?.(data);
  if (!plan) return;
  const [armLabel, action, body, done, after] = plan;
  if (armLabel && !arm(button, armLabel)) return;
  button.disabled = true;
  try { await api(action, body); toast(done); after?.(); }
  catch (error) { toast(error.message, true); }
  finally { button.disabled = false; }
}, true);
$("open-queue").addEventListener("click", queueSheet);
$("open-operator").addEventListener("click", operatorSheet);
$("add-project").addEventListener("click", projectSheet);

// The run switch: pausing stops every agent and returns its work to waiting; resuming lets them start again.
function renderRunstate(L) {
  const button = $("pause-all");
  button.classList.toggle("paused", !!L.paused);
  setText(button.querySelector("b"), L.paused ? "Paused" : "Running");
  setText(button.querySelector("small"), L.paused ? "Resume agents" : "Pause everything");
  button.title = L.paused ? "Let agents start again" : "Stop every agent; their work returns to waiting";
}
$("pause-all").addEventListener("click", async event => {
  const paused = LAST.paused, button = event.currentTarget;
  button.disabled = true;
  try { await api(paused ? "go" : "stop", {}); renderRunstate({paused: !paused}); LAST.paused = !paused; toast(paused ? "Resumed" : "Paused all agents"); }
  catch (error) { toast(error.message, true); }
  finally { button.disabled = false; }
});

let SCOUTING = false;
$("scout-now").addEventListener("click", async event => {
  SCOUTING = true;
  event.currentTarget.disabled = true;
  try { toast((await api("scout", {})).created ? "Scout scheduled" : "A scout is already scheduled"); }
  catch (error) { toast(error.message, true); }
  finally { SCOUTING = false; }
});

let CLEARING = false;
$("clear-task-history").addEventListener("click", async event => {
  const button = event.currentTarget;
  if (!arm(button, "Really clear? Finished records go for good")) return;
  CLEARING = true;
  button.disabled = true;
  $("clear-task-status").textContent = "Clearing…";
  try { $("clear-task-status").textContent = `${(await api("clear-task-history", {})).removed} removed`; }
  catch (error) { $("clear-task-status").textContent = error.message; }
  finally { CLEARING = false; }
});

let VIEWERS_SAVING = false;
$("viewers").addEventListener("click", async event => {
  const button = event.currentTarget, show = button.getAttribute("aria-checked") !== "true";
  VIEWERS_SAVING = button.disabled = true;
  try { await api("viewers", {show}); renderViewers(show); $("viewers-status").textContent = ""; }
  catch (error) { $("viewers-status").textContent = error.message; }
  finally { VIEWERS_SAVING = button.disabled = false; }
});
function renderViewers(showing) {
  const button = $("viewers");
  button.setAttribute("aria-checked", String(!!showing));
  setText(button.querySelector("span"), showing ? "Following agents" : "Off");
}

// Per-viewer conveniences, kept in this browser only: which messages were seen, and the history filter.
const stored = (key, fallback) => { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; } };
const store = (key, value) => { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} };

// Messages agents sent the user (also relayed by Coin), newest first; Reply goes to the sender's inbox while its task is active.
let MESSAGES_SEEN = stored("cointos.messagesSeen", null);
const OPEN_MESSAGES = new Set();
function renderMessages(L) {
  const mine = (L.messages || []).filter(m => m.to === "user").slice(-40).reverse();
  if (MESSAGES_SEEN === null) store("cointos.messagesSeen", MESSAGES_SEEN = L.updated_at - 86400);  // a first visit flags only the last day
  const fresh = mine.filter(m => m.at > MESSAGES_SEEN).length;
  setText($("msg-new"), fresh ? `${fresh} new` : "");
  setHTML($("messages"), mine.map(m => {
    const t = L.tasks[m.from], live = t && tasks_active(t), n = t ? taskName(t) : named(m.from.split(":").pop(), m.from.split(":")[0]);
    const who = m.from === "user" ? "CointOS" : n.head;
    const when = new Date(m.at * 1000), today = when.toDateString() === new Date(Date.now()).toDateString();
    return `<div class="msg${m.at > MESSAGES_SEEN ? " new" : ""}${OPEN_MESSAGES.has(m.at) ? " open" : ""}" data-at="${m.at}">` +
      `<header><b ${t ? `data-key="${esc(m.from)}"` : ""} title="${esc(m.from)}">${esc(who)}</b><span>${esc([m.from === "user" ? "" : n.context].filter(Boolean).concat("").join(" · "))}` +
      `${today ? when.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"}) : when.toLocaleDateString([], {month: "short", day: "numeric"})}</span>` +
      (live ? `<button type="button" class="btn" data-act="message" data-item="${esc(m.from)}" data-quote="${esc(m.text.slice(0, 600))}">Reply</button>` : "") +
      `</header><p>${esc(m.text)}</p></div>`;
  }).join("") || `<p class="muted">No messages yet. Agents write here when they need you.</p>`);
}
const tasks_active = t => ["waiting", "running", "review"].includes(t.status);
$("messages").addEventListener("click", e => {
  const msg = e.target.closest(".msg");
  if (!msg || e.target.closest("button, [data-key]")) return;
  const at = Number(msg.dataset.at);
  OPEN_MESSAGES.has(at) ? OPEN_MESSAGES.delete(at) : OPEN_MESSAGES.add(at);
  msg.classList.toggle("open");
  if (at > MESSAGES_SEEN) { MESSAGES_SEEN = at; store("cointos.messagesSeen", at); if (LAST.L) renderMessages(LAST.L); }
});

const short_task = t => String(t || "").replace(/^[^:]+:/, "").replace(/^what\/is\/\w+\//, "").replace(/\.md$/, "");

function renderMachine(L) {
  $("lanes").innerHTML = `<h3>Lanes</h3>` + Object.entries(L.models).map(([name, m]) =>
    L.lanes.filter(l => l.model === name).map(l => {
      const holder = L.thoughts[l.holder];
      const who = holder ? `<button type="button" class="chip held lane-free" data-act="pause-agent" data-agent="${esc(holder.agent)}" title="Pause ${esc(holder.agent)} to free this lane">${esc(holder.agent)} <b>✕</b></button>`
        : `<span class="muted">${m.up ? "free" : m.launching ? "launching" : "down"}</span>`;
      return `<div class="lane-row ${holder ? "held" : m.up ? "" : "down"}"><span class="sq"></span><span class="name">${esc(short(name))}</span>` +
        `<span class="muted">lane ${l.index}</span>${who}</div>`;
    }).join("")).join("");
  renderMemory({memory: L.memory, models: L.models, model_memory: L.model_memory, guard: L.guard,
                saved_bytes: Object.values(L.snapshots).filter(s => s.tier === "memory").reduce((n, s) => n + s.bytes, 0)});
}

const MEMORY_COLOURS = [["Operating System", "#28262b"], ["Model weights", "#9f3b52"], ["KV-cache", "#e9687e"],
                        ["Saved contexts", "#ec98a5"], ["Free", "#ece3e0"]];

function memoryValues(M) {
  const m = M.memory;
  const gib = gb => gb * 1e9 / 2 ** 30;  // shown in GiB (written "GB"), as RAM is sized
  const loaded = Object.entries(M.models).filter(([, model]) => model.up).map(([name]) => M.model_memory[name]);
  const weights = loaded.reduce((n, x) => n + x.weights_gb, 0);
  const kv = loaded.reduce((n, x) => n + x.memory_gb - x.weights_gb, 0);
  const saved = M.saved_bytes / 2 ** 30, physical = gib(m.physical_gb);
  // Gufo's anonymous weights already reduce MemAvailable; file-backed llama weights can be
  // reclaimed. Remove only non-reclaimable weights from used RAM before labelling the rest OS.
  const residentWeights = loaded.reduce((n, x) => n + (x.weights_reclaimable === false ? x.weights_gb : 0), 0);
  const used = Math.max(0, physical - gib(m.available_gb));
  const system = Math.max(0, used - residentWeights - kv - saved);
  const free = Math.max(0, physical - system - weights - kv - saved);
  return [system, weights, kv, saved, free];
}

function renderMemory(M) {
  // The operating system in ink, CointOS's parts in steps of the site's rose, free as pale paper.
  const m = M.memory || {};
  if (m.physical_gb === undefined) return;
  const values = memoryValues(M);
  MEMORY_PARTS = MEMORY_COLOURS.map(([name, colour], i) => [name, values[i], colour]);
  if (!$("membar")) {
    $("memory").innerHTML = `<h3>Memory</h3><div class="memhead"><b id="mem-value"></b><span id="mem-label"></span></div>` +
      `<div class="membar" id="membar" onmouseleave="focusPart(-1)">` +
      MEMORY_COLOURS.map(([, colour], i) => `<span class="seg" data-i="${i}" style="background:${colour}" onmouseenter="focusPart(${i})"></span>`).join("") +
      `</div><div class="legend">` + MEMORY_COLOURS.map(([name, colour], i) =>
        `<div class="item" data-i="${i}" onmouseenter="focusPart(${i})" onmouseleave="focusPart(-1)"><i style="background:${colour}"></i>` +
        `<span>${name}</span><b></b><em></em></div>`).join("") + `</div><div class="memfacts" id="memfacts"></div>`;
  }
  const total = values.reduce((n, v) => n + v, 0);
  document.querySelectorAll("#membar .seg").forEach((seg, i) => seg.style.width = `${total ? values[i] / total * 100 : 0}%`);
  const inUse = total - values[4];
  if ($("tile-mem")) {
    setText($("tile-mem").querySelector("b"), `${total ? Math.round(inUse / total * 100) : 0}%`);
    setText($("tile-mem").querySelector("small"), `${inUse.toFixed(0)} of ${total.toFixed(0)} GB`);
    $("tile-mem").querySelector(".meter i").style.width = `${total ? inUse / total * 100 : 0}%`;
  }
  document.querySelectorAll(".legend .item").forEach((item, i) => {
    setText(item.querySelector("b"), `${values[i].toFixed(1)} GB`);
    setText(item.querySelector("em"), `${total ? Math.round(values[i] / total * 100) : 0}%`);
  });
  setHTML($("memfacts"), `pressure ${m.psi} · swap ${m.swap_gb} GB` +
    (M.guard && M.guard.blocked ? ` · <b>background waiting for memory</b>` : "") + (M.guard && M.guard.killed ? ` · <b>work model killed</b>` : ""));
  focusPart(FOCUSED);
}

let MEMORY_PARTS = [], FOCUSED = -1;
function focusPart(i) {
  FOCUSED = i;
  if (!$("membar")) return;
  document.querySelectorAll("#membar .seg").forEach(seg => seg.style.opacity = i < 0 || +seg.dataset.i === i ? 1 : .35);
  document.querySelectorAll(".legend .item").forEach(item => item.classList.toggle("on", +item.dataset.i === i));
  const total = MEMORY_PARTS.reduce((n, p) => n + p[1], 0);
  const inUse = total - (MEMORY_PARTS[4]?.[1] || 0);
  setText($("mem-value"), i < 0 ? `${inUse.toFixed(0)} GB` : `${MEMORY_PARTS[i][1].toFixed(1)} GB`);
  setText($("mem-label"), i < 0 ? `in use of ${total.toFixed(0)} GB` : MEMORY_PARTS[i][0].toLowerCase());
}

function renderChecks(L) {
  const failing = L.checks.filter(c => !c.ok);
  const labels = {
    "no lane idle while an agent waits": "A GPU lane is idle while work is waiting",
    "higher classes pre-empt": "Higher-priority work is waiting",
    "no agent starves": "An agent is overdue for GPU time",
    "no silent agent": "An agent has stopped reporting",
    "no looping agent": "An agent is repeating the same output",
    "no stalled thought": "A model request has stopped progressing",
    "no stray agent processes": "Unmanaged agent processes remain",
    "no item waits on a dead dependency": "Work is blocked by a dependency",
    "blocked work has a recovery owner": "Blocked work has no active recovery",
    "event journal writable": "The event journal cannot be written",
    "memory within bounds": "Memory pressure exceeds limits",
  };
  setText($("checks-summary"), failing.length ? `Diagnostics · ${failing.length} ${failing.length === 1 ? "issue" : "issues"}`
    : L.checks.length ? "Diagnostics · all checks pass" : "Diagnostics · waiting for checks");
  setHTML($("checks"), failing.map(c => {
    const rows = c.name === "no item waits on a dead dependency"
      ? Object.keys(L.dependency_problems || {}).map(item => ({item, blocker: "Waiting for its dependency. Open the work item to inspect it."}))
      : c.name === "blocked work has a recovery owner"
        ? (L.work_frontier || []).filter(row => !L.paused && row.status === "blocked" && !row.held_by
          && !row.admission_hold && !row.owner && !row.continuations?.length) : [];
    const items = rows.map(row => {
      const r = L.queue?.[row.item], title = r?.summary || named(row.item.split(":").slice(1).join(":"), r?.project).head;
      return `<li><a data-key="${esc(row.item)}" href="#/${encodeURIComponent(r?.project || "")}/${encodeURIComponent(row.item)}">${esc(title || row.item)}</a>` +
        `<span>${esc(row.blocker || "No active recovery or corrective work.")}</span></li>`;
    }).join("");
    return `<section class="check"><h3>${esc(labels[c.name] || `Check failed: ${c.name}`)}</h3>` +
      (items ? `<ul>${items}</ul>` : "") + `<details><summary>Technical details</summary><pre>${esc(c.detail)}</pre></details></section>`;
  }).join(""));
}

// Low-level machine events: lane switches, snapshots and notices. Recently hides them unless asked.
const MACHINE_EVENTS = new Set(["switch", "shared prefix saved", "snapshot forgotten", "snapshot evicted", "snapshot spilled",
  "snapshot transfer recovered", "saved on stop", "snapshots moved to disk for shutdown", "viewer", "divergence",
  "tool history preserved", "reasoning budget reached", "reasoning changed"]);
function sentence(h) {
  const lane = h.model ? `${short(h.model)} lane ${h.lane}` : `lane ${h.lane}`;
  switch (h.event) {
    case "agent started": return `${h.agent} started on ${short_task(h.task)} (run ${h.run})`;
    case "agent ended": return `${h.agent} ended: ${h.reason}`;
    case "agent adopted": return `${h.agent} carried on through a daemon restart`;
    case "task created": return `new task: ${short_task(h.task)}`;
    case "receipt": return `${short_task(h.task)} finished: ${h.disposition}`;
    case "queued": return `queued ${h.project}:${h.item}`;
    case "item revised": return `${short_task(h.item)} revised by ${h.by}`;
    case "paused": return "paused: agents stopped";
    case "resumed": return "resumed: agents may start";
    case "scout requested": return h.created ? "scout scheduled" : "scout already scheduled";
    case "operator requested": return `operator requested: ${short_task(h.task)}`;
    case "daemon started": return "daemon started";
    case "daemon stopped": return "daemon stopped";
    case "switch": return `${lane}: ${h.out ? short_task(h.out) : "empty"} → ${short_task(h.into)}` +
      (h.restored ? ` (restored ${h.restored.toLocaleString()} tokens)` : " (cold)") + (h.saved ? ", saved the outgoing" : "");
    case "reasoning budget reached": return `${h.agent} reached its reasoning cap (${h.tokens} tokens) and moved on to answer`;
    case "tool history preserved": return `${h.agent}: tool history kept through compaction`;
    case "shared prefix saved": return `shared start saved: ${h.tokens.toLocaleString()} tokens`;
    case "snapshot forgotten": return `forgot a snapshot of ${short_task(h.owner)}: ${h.reason}`;
    case "saved on stop": return `${lane}: saved ${short_task(h.owner)} as the daemon stopped`;
    case "snapshots moved to disk for shutdown": return `moved ${h.count} saved contexts to disk for shutdown`;
    case "model up": return `${short(h.model)} is up`;
    case "viewer": return `viewer ${h.slot} now shows ${h.agent}`;
    case "alert": return h.text;
    default: {
      const {at, event, ...rest} = h;
      return `${event}${Object.keys(rest).length ? ": " + Object.entries(rest).map(([k, v]) => `${k} ${typeof v === "object" ? JSON.stringify(v) : v}`).join(", ") : ""}`;
    }
  }
}
let HISTORY_ALL = stored("cointos.historyAll", false);
$("history-all").setAttribute("aria-checked", String(HISTORY_ALL));
$("history-all").addEventListener("click", e => {
  HISTORY_ALL = !HISTORY_ALL; store("cointos.historyAll", HISTORY_ALL);
  e.currentTarget.setAttribute("aria-checked", String(HISTORY_ALL));
  if (LAST.L) renderHistory(LAST.L);
});
function renderHistory(L) {
  const shown = L.history.filter(h => HISTORY_ALL || !MACHINE_EVENTS.has(h.event)).slice(-60).reverse();
  setHTML($("history"), shown.map(h =>
    `<div class="${h.event === "alert" ? "alert-line" : ""}"><span class="when">${new Date(h.at * 1000).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"})}</span>` +
    `<span class="what" title="${esc(sentence(h))}">${esc(sentence(h))}</span></div>`).join("") ||
    `<p class="muted">Nothing but machine events lately.</p>`);
}

const schedulerControls = [
  {id: "slice", key: "slice_seconds", unit: "s", saving: false, error: ""},
  {id: "chunk", key: "chunk_tokens", unit: "tokens", saving: false, error: ""}
];
function renderScheduler(L) {
  for (const control of schedulerControls) {
    const input = $(control.id), value = L.scheduler?.[control.key];
    if (value === undefined) continue;
    if (![...input.options].some(o => Number(o.value) === value))
      input.add(new Option(`${value} ${control.unit}`, String(value)));
    if (!control.saving && document.activeElement !== input) input.value = String(value);
    input.disabled = control.saving;
    $(control.id + "-status").textContent = control.saving ? "Saving…" :
      control.error || L.config_error || "";
  }
  if (!VIEWERS_SAVING) { renderViewers(L.viewers_showing); $("viewers").disabled = false; }
}
for (const control of schedulerControls) $(control.id).addEventListener("change", async event => {
  control.saving = true;
  control.error = "";
  event.target.disabled = true;
  const status = $(control.id + "-status");
  status.textContent = "Saving…";
  try {
    const response = await fetch("/api/scheduler", {method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({[control.key]: Number(event.target.value)})});
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || "Could not save scheduler setting");
    status.textContent = "";
  } catch (error) {
    control.error = error.message;
    status.textContent = control.error;
  } finally {
    control.saving = false;
    event.target.disabled = false;
    event.target.blur();
  }
});

// The strip: model speed, then the work and the machine at a glance, in one row of tiles.
const STRIP = ["perf-generation", "perf-prefill", "perf-mtp", "tile-agents", "tile-queue", "tile-landed", "tile-mem"];
function ensureStrip() {
  if (!$("tile-mem")) $("strip").innerHTML = STRIP.map(id =>
    `<div class="tile" id="${id}"><span></span><b></b><small></small>${id === "tile-mem" ? `<div class="meter"><i></i></div>` : ""}</div>`).join("");
}

function renderPerformance(S) {
  const p = S.performance || {};
  const entries = [
    ['generation', 'Generation', p.generation_tps, 'tok/s', 'Output tokens ÷ generation time; includes reasoning tokens.'],
    ['prefill', 'Prefill', p.prefill_tps, 'tok/s', 'Newly processed input tokens ÷ prefill call time; cached tokens and snapshot I/O excluded.'],
    ['mtp', 'MTP acceptance', p.mtp_acceptance, '%', 'Accepted draft tokens ÷ proposed draft tokens; not the proportion of output tokens.']
  ];
  for (const [id, label, value, unit, help] of entries) {
    const tile = $(`perf-${id}`);
    const valid = typeof value === 'number' && Number.isFinite(value);
    setText(tile.querySelector('span'), label);
    setText(tile.querySelector('b'), valid ? `${value.toLocaleString(undefined, {maximumFractionDigits: 1})}${unit === '%' ? '%' : ' tok/s'}` : '—');
    setText(tile.querySelector('small'), valid ? (id === 'mtp' ? 'of drafted tokens' : 'smoothed over ~10 s') : 'Waiting for phase samples');
    tile.title = help + ' One-pole exponential smoothing across completed steps, with a 10-second active-time constant per phase. Inactive phases hold their values.';
  }
}

function render(L) {
  ensureStrip();
  renderPerformance(L);
  const agents = Object.values(L.agents);
  const stamp = $("stamp");
  stamp.className = "stamp";
  stamp.textContent = "updated " + new Date(L.updated_at * 1000).toLocaleTimeString();
  const tile = (id, label, value, note, kind = "") => {
    const el = $(`tile-${id}`);
    if (el.className !== `tile ${kind}`.trim()) el.className = `tile ${kind}`.trim();
    setText(el.querySelector("span"), label); setText(el.querySelector("b"), String(value)); setText(el.querySelector("small"), note);
  };
  LAST = {paused: L.paused, guard: L.guard, tasks: L.tasks, queue: L.queue, L};
  FLOW = computeFlow(L);
  const items = [...FLOW.items.values()], dayAgo = Date.now() / 1000 - 86400;
  const at = s => items.filter(it => it.step === s).length;
  const held = L.lanes.filter(l => L.thoughts[l.holder]).length;  // the lanes are the one truth
  const waiting = Object.values(L.thoughts).filter(t => t.lane === null).length;
  tile("agents", "Agents", agents.length, L.paused ? "paused" : `${held}/${L.lanes.length} on GPU${waiting ? ` · ${waiting} waiting` : ""}`, L.paused ? "bad" : "dark");
  tile("queue", "Queue", at("ready") + at("blocked"), `${at("ready")} ready · ${at("blocked")} blocked`);
  const landed = items.filter(it => it.step === "landed" && it.updated > dayAgo).length;
  tile("landed", "Landed · 24 h", landed, `${at("landed")} in all`);
  setText($("tile-mem").querySelector("span"), "Memory");
  renderRunstate(L);
  $("home").hidden = !!ROUTE.project; $("project-page").hidden = !ROUTE.project;
  document.querySelector(".cols").classList.toggle("wide", !!ROUTE.project);
  if (ROUTE.project) renderProjectPage(L); else renderHome(L);
  renderAgents(L);
  renderWork(L);
  renderMessages(L);
  renderMachine(L);
  renderScheduler(L);
  renderChecks(L);
  renderDrawer(L);
  renderHistory(L);
}

let LAST = {paused: false, guard: {}};
readRoute();
async function poll() {
  const controller = new AbortController();
  const deadline = setTimeout(() => controller.abort(), 30000);
  let snapshot;
  try {
    const response = await fetch("/api/ledger", {cache: "no-store", signal: controller.signal});
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    snapshot = await response.json();
  } catch (e) {
    $("stamp").className = "stamp bad";
    $("stamp").textContent = `Connection to ${location.host} failed: ${e.name === "AbortError" ? "timed out" : e.message} · retrying`;
    console.error("Dashboard snapshot request failed", e);
  } finally { clearTimeout(deadline); }
  if (snapshot) {
    try { render(snapshot); }
    catch (e) {
      $("stamp").textContent = `Dashboard display failed: ${e.message}`;
      console.error("Dashboard rendering failed", e);
    }
  }
  setTimeout(poll, 1000);
}
poll();
// Agent cards and memory, ten times a second.
new EventSource("/api/live").onmessage = event => {
  const F = JSON.parse(event.data);
  ensureStrip();
  renderPerformance(F);
  renderAgents({...F, tasks: LAST.tasks, queue: LAST.queue, paused: LAST.paused});
  renderMemory({...F, guard: LAST.guard});
};
