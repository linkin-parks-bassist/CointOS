<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CointOS</title>
<style>
/* Styled after David's site (~/Projects/Website/style.css): blush paper, ink, rose accent,
   square corners, hard offset shadows, heavy tight system sans. */
:root {
  color-scheme: light;
  --bg: #fff9f5; --paper: #fffdfb; --ink: #28262b; --ink-soft: #5d565b; --ink-faint: #766d71;
  --accent: #9f3b52; --accent-bright: #e9687e; --accent-wash: #f9eae6; --line: #9a858a;
  --line-soft: #e5d9d7; --shadow: #e9d9d6; --dark: #29272c; --dark-2: #343137; --dark-line: #4a4549;
  --dark-text: #fff5ef; --dark-soft: #cfc3bf; --pink-shadow: #e8b7b8;
  font-family: ui-sans-serif, system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; color: var(--ink); font-size: 15px; line-height: 1.5; font-variant-numeric: tabular-nums;
  background: radial-gradient(circle at 88% 5%, #ffd8d8, transparent 25%), var(--bg); min-height: 100vh; }
main { max-width: 1600px; margin: auto; padding: 26px 16px 60px; }
.topline { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; flex-wrap: wrap;
  border-bottom: 2px solid var(--dark); padding-bottom: 14px; }
.mark { margin: 0; font-size: clamp(40px, 5vw, 64px); line-height: .92; letter-spacing: -.07em; font-weight: 900; }
.mark em { font-style: normal; color: var(--accent-bright); }
.stamp { color: var(--ink-faint); font-size: 13px; }
.summary { margin: 16px 0 0; font-size: clamp(17px, 2vw, 22px); line-height: 1.35; color: var(--ink-soft); }
.summary b { color: var(--ink); font-weight: 900; }
.dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 10px;
  background: var(--ink); border: 2px solid var(--dark); vertical-align: 1px; }
.dot.bad { background: var(--accent-bright); }
.alert { margin-top: 18px; padding: 13px 18px; border-left: 5px solid var(--accent-bright); background: var(--accent-wash); }
.alert:empty { display: none; }
.agents { margin-top: 26px; display: grid; gap: 18px; grid-template-columns: repeat(6, minmax(0, 1fr)); --capacity: 1; }
@media (min-width: 700px) { .agents { --capacity: 2; } }
@media (min-width: 1100px) { .agents { --capacity: 3; } }
.agent { --c: var(--accent-bright); position: relative; background: var(--dark); color: var(--dark-text); border: 2px solid var(--dark); box-shadow: 7px 7px 0 var(--pink-shadow);
  padding: 18px 20px 11px; display: grid; grid-template-columns: 18px 1fr auto; gap: 4px 14px; min-width: 0; }
/* The agent's state, as a flat square: solid (and slowly pulsing) while the model works for it,
   an outline while it waits for a lane, cream while its tools run, dashed while it starts. */
.agent .mark { grid-row: 1 / 4; width: 18px; height: 18px; margin-top: 3px; border: 2px solid var(--c); }
.agent .mark.thinking { background: var(--c); animation: pulse 2.4s ease-in-out infinite; }
.agent .mark.tools { background: var(--dark-text); border-color: var(--dark-text); }
.agent .mark.starting { border-style: dashed; }
@keyframes pulse { 50% { opacity: .45; } }
/* Uptime, tokens written, and speed while writing: a fixed three lines, so cards keep their size. */
.agent .stats { grid-column: 3; grid-row: 1 / 4; text-align: right; font-size: 12px; line-height: 1.35;
  color: var(--dark-soft); white-space: nowrap; font-variant-numeric: tabular-nums; }
.agent .stats b { display: block; font: 900 20px/1.05 ui-sans-serif, system-ui, sans-serif; letter-spacing: -.03em;
  color: var(--dark-text); }
.agent .stats span { display: block; min-height: 1.35em; }
.agent .role { grid-column: 2; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--c); font-weight: 900; }
.agent .work { grid-column: 2; font-size: 20px; font-weight: 900; letter-spacing: -.04em; line-height: 1.15; overflow-wrap: anywhere; }
.agent .now { grid-column: 1 / -1; margin-top: 10px; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.agent .now b { color: var(--c); }
/* The agent's words as they stream, bottom-anchored like a terminal, at a fixed height. */
.agent .live { position: relative; grid-column: 1 / -1; margin-top: 10px; height: 6.4em; overflow: hidden; display: flex;
  flex-direction: column; justify-content: flex-end; font: 12.5px/1.45 ui-monospace, monospace; background: var(--dark-2);
  border: 1px solid var(--dark-line); padding: 8px 10px; }
/* The oldest words fade into the box; the box itself keeps its edges. */
.agent .live::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2.8em; z-index: 1;
  background: linear-gradient(color-mix(in oklab, var(--dark-2) 80%, transparent), transparent); pointer-events: none; }
.agent .live i { color: var(--dark-soft); opacity: .75; white-space: pre-wrap; overflow-wrap: anywhere; }
.agent .live p { margin: 6px 0 0; color: var(--dark-text); white-space: pre-wrap; overflow-wrap: anywhere; }
.agent .live p.tool { color: var(--c); }
.agent .meta { grid-column: 2; margin-top: 2px; font-size: 12px; color: var(--dark-soft); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }
/* Along the card's bottom edge, out of the layout: showing it moves nothing. */
.agent .progress { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--dark-2); }
.agent .progress span { display: block; height: 100%; background: var(--c); transition: width 1.5s linear; }
.empty { margin-top: 26px; padding: 26px; border: 2px dashed var(--line); color: var(--ink-soft); font-size: 18px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; margin-top: 34px; }
.panel { border: 1px solid var(--line); background: var(--paper); box-shadow: 4px 4px 0 var(--shadow); padding: 20px 22px; min-width: 0; }
.panel.wide { grid-column: 1 / -1; }
h2 { font-size: clamp(24px, 2.6vw, 30px); line-height: 1; letter-spacing: -.055em; margin: 0 0 12px; font-weight: 900; }
h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-faint); margin: 18px 0 4px; }
.row { display: grid; grid-template-columns: 5px 1fr auto; gap: 2px 12px; padding: 10px 0; border-top: 1px solid var(--line-soft); }
.row .bar { grid-row: 1 / 3; background: var(--line-soft); border: 1px solid var(--dark); }
.row.running .bar { background: var(--accent-bright); } .row.done .bar { background: var(--ink-faint); }
.row.failed .bar { background: var(--accent); }
.row .who { font-weight: 900; letter-spacing: -.02em; overflow-wrap: anywhere; }
.row .state { font-size: 14px; color: var(--ink-soft); text-align: right; }
.row .meta { grid-column: 2 / 4; font-size: 13px; color: var(--ink-faint); overflow-wrap: anywhere; }
.muted { color: var(--ink-faint); }
.chip { font-size: 12px; padding: 2px 9px; border: 1px solid var(--line); border-radius: 20px; background: var(--bg); }
.chip.held { background: var(--accent-wash); border-color: var(--accent); color: var(--accent); font-weight: 700; }
.machine-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px 40px; }
.lane-row { display: grid; grid-template-columns: 130px 56px 1fr; align-items: center; gap: 8px; padding: 6px 0;
  border-top: 1px solid var(--line-soft); font-size: 14px; }
.lane-row:first-of-type { border-top: 0; }
.lane-row .name { font-weight: 900; }
.lane-row .chip { justify-self: start; }
.mem { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; margin-top: 4px; }
.donut { width: 160px; height: 160px; flex: none; }
.donut .seg { transition: opacity .15s; cursor: default; }
.donut text { text-anchor: middle; fill: var(--ink); font-family: inherit; }
.donut .big { font-size: 20px; font-weight: 900; letter-spacing: -.03em; } .donut .small { font-size: 11px; fill: var(--ink-faint); }
.legend { display: grid; gap: 4px; font-size: 14px; min-width: 240px; flex: 1; }
.legend .item { display: grid; grid-template-columns: 12px 1fr auto 40px; align-items: center; gap: 8px; padding: 2px 4px; }
.legend .item.on { background: var(--accent-wash); }
.legend i { width: 12px; height: 12px; border-radius: 2px; }
.legend b { font-variant-numeric: tabular-nums; } .legend em { font-style: normal; color: var(--ink-faint); text-align: right; }
.memfacts { margin-top: 6px; font-size: 13px; color: var(--ink-faint); }
.check { margin-top: 16px; padding: 8px 12px; font-size: 14px; border: 1px solid var(--line); }
.check.ok { color: var(--ink); font-weight: 900; background: var(--paper); }
.check.no { color: var(--accent); border-color: var(--accent); background: var(--accent-wash); } .check.no + .check.no { margin-top: 6px; }
.meta.one { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* Finished work, folded away; opened, a bounded list that keeps its scroll through updates. */
.done summary { cursor: pointer; list-style: none; } .done summary::-webkit-details-marker { display: none; }
.done summary h3 { display: inline-block; } .done summary h3::before { content: "▸ "; } .done[open] summary h3::before { content: "▾ "; }
.done-list { max-height: 420px; overflow: auto; }
.history { font-size: 13px; max-height: 360px; overflow: auto; }
.history div { display: flex; gap: 12px; padding: 4px 0; border-top: 1px solid var(--line-soft); }
.history .when { color: var(--ink-faint); flex: none; font-variant-numeric: tabular-nums; }
.history .what { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.history .alert-line .what { color: var(--accent); font-weight: 700; }
.memdetail { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 8px; }
.memdetail > div { display: grid; grid-template-columns: minmax(140px,1fr) auto; gap: 3px 12px; padding: 5px 0; font-size: 12px; }
.memdetail span { display: flex; align-items: center; gap: 8px; }
.memdetail i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
.memdetail b { font-variant-numeric: tabular-nums; }
.memdetail small { grid-column: 1 / -1; color: var(--ink-faint); padding-left: 17px; }
</style>
</head>
<body>
<main>
  <div class="topline"><h1 class="mark">Coint<em>OS</em></h1><span class="stamp" id="stamp">connecting…</span></div>
  <p class="summary" id="summary"></p>
  <div class="alert" id="alert"></div>
  <div id="agents"></div>
  <div class="grid">
    <section class="panel wide machine"><h2>Machine</h2><div class="machine-grid"><div id="lanes"></div><div id="memory"></div></div>
      <div id="checks"></div></section>
    <section class="panel wide"><h2>Work</h2><div id="work"></div>
      <details class="done" id="done"><summary><h3>Done <span id="done-count"></span></h3></summary><div class="done-list" id="done-list"></div></details></section>
    <section class="panel wide"><h2>Recently</h2><div class="history" id="history"></div></section>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const ago = t => { const s = Math.max(0, Date.now() / 1000 - t) | 0;
  return s < 120 ? s + "s" : s < 7200 ? (s / 60 | 0) + "m" : (s / 3600 | 0) + "h"; };

const short = model => model.replace(/-GGUF$/, "");

// What an agent is doing right now, from its thoughts.
function phase(L, a) {
  const mine = Object.values(L.thoughts).filter(t => t.agent === a.id);
  const running = mine.find(t => t.lane !== null), queued = mine.find(t => t.lane === null);
  if (a.state === "starting") return ["starting", "Starting", `for ${ago(a.started_at)}`];
  if (running && a.state === "reading") {
    const share = Math.min(1, (running.held || 0) / Math.max(1, running.prompt));
    return ["thinking", "Reading", `${Math.round(share * 100)}% of ${running.prompt.toLocaleString()} tokens`, share];
  }
  if (running) return ["thinking", (a.live || {}).phase === "writing" ? "Writing" : "Reasoning", `for ${ago(running.since)} on ${short(running.model)} · ${running.generated} tokens so far`];
  if (queued) return ["waiting", "Waiting", `for a lane, ${ago(queued.waiting_since)}`];
  return ["tools", "Running", "its tools"];
}

// Agent cards are built once and then updated in place (the live stream updates them ten
// times a second), so animations run on, and hover and selection survive.
function setText(el, value) { if (el.textContent !== value) el.textContent = value; }
function setHTML(el, value) { if (el.dataset.html !== value) { el.dataset.html = value; el.innerHTML = value; } }

// Balance rows with the smaller rows first; each row still fills the full width.
function agentRowSizes(count, capacity) {
  if (!count) return [];
  const rows = Math.ceil(count / capacity), small = Math.floor(count / rows), larger = count % rows;
  return Array.from({length: rows}, (_, i) => small + (i >= rows - larger ? 1 : 0));
}

function renderAgents(S) {
  const agents = Object.values(S.agents).sort((a, b) => a.started_at - b.started_at);
  let grid = $("agents").querySelector(".agents");
  if (!agents.length) {
    setHTML($("agents"), `<div class="empty">${S.paused ? "Agents are paused. <b>cointos go</b> lets them run again."
      : "No agents right now. They start as work appears in the queues."}</div>`);
    return;
  }
  if (!grid) { $("agents").innerHTML = `<div class="agents"></div>`; $("agents").dataset.html = ""; grid = $("agents").firstChild; }
  const capacity = Number(getComputedStyle(grid).getPropertyValue("--capacity"));
  const spans = agentRowSizes(agents.length, capacity).flatMap(size => Array(size).fill(6 / size));
  const cards = new Map([...grid.children].map(card => [card.dataset.id, card]));
  agents.forEach((a, index) => {
    let card = cards.get(a.id);
    if (!card) {
      card = document.createElement("article");
      card.className = "agent";
      card.dataset.id = a.id;
      card.innerHTML = `<div class="mark"></div><div class="role"></div><div class="stats"><b></b><span></span><span></span></div><div class="work"></div>` +
        `<div class="meta"></div><div class="live"><div></div></div><div class="now"></div><div class="progress"><span></span></div>`;
    }
    if (grid.children[index] !== card) grid.insertBefore(card, grid.children[index] || null);
    cards.delete(a.id);
    card.style.gridColumn = `span ${spans[index]}`;
    const [kind, label, detail, share] = phase(S, a), q = selector => card.querySelector(selector);
    const mark = q(".mark");
    if (mark.className !== `mark ${kind}`) mark.className = `mark ${kind}`;
    const [uptime, written, rate] = q(".stats").children;
    setText(uptime, ago(a.started_at));
    setText(written, `${a.generated.toLocaleString()} tok`);
    setText(rate, a.rate && a.state === "thinking" && kind === "thinking" && share === undefined ? `${a.rate.toFixed(1)} tok/s` : "idle");
    setText(q(".role"), `${a.role} · ${a.place}`);
    setText(q(".work"), a.title.replace(/-/g, " "));
    setText(q(".meta"), a.id);
    const live = a.live || {};
    const words = (live.reasoning ? `<i>${esc(live.reasoning)}</i>` : "") + (live.content ? `<p>${esc(live.content)}</p>` : "") +
      ((kind === "tools" || !(live.reasoning || live.content)) && a.doing ? `<p class="tool">⚙ ${esc(a.doing)}</p>` : "");
    setHTML(q(".live > div"), words);
    setHTML(q(".now"), `<b>${label}</b> ${esc(detail)}`);
    const bar = q(".progress");
    bar.style.display = share === undefined ? "none" : "";
    if (share !== undefined) q(".progress span").style.width = `${(share * 100).toFixed(1)}%`;
  });
  cards.forEach(card => card.remove());
}

function renderWork(L) {
  const groups = [["running", "In progress"], ["review", "Waiting for the integrator"], ["waiting", "Up next"],
                  ["failed", "Gave up"]];
  const tasks = Object.values(L.tasks).sort((a, b) => b.updated_at - a.updated_at);
  const rows = (status, some) => some.map(t => `<div class="row ${status}"><div class="bar"></div>` +
    `<div class="who">${esc(t.place)}: ${esc(t.title.replace(/-/g, " "))}</div>` +
    `<div class="state">${esc(t.role)} · run ${t.runs} · ${ago(t.updated_at)} ago</div>` +
    `<div class="meta one" title="${esc(status === "done" && t.result ? t.result : t.note || "")}">${esc(status === "done" && t.result ? t.result : t.note || "")}</div></div>`).join("");
  setHTML($("work"), tasks.length ? groups.map(([status, title]) => {
    const some = tasks.filter(t => t.status === status);
    return some.length ? `<h3>${title}</h3>` + rows(status, some) : "";
  }).join("") : `<p class="muted">No work yet.</p>`);
  const done = tasks.filter(t => t.status === "done");
  $("done").style.display = done.length ? "" : "none";
  setText($("done-count"), `· ${done.length}`);
  setHTML($("done-list"), rows("done", done));
}

const short_task = t => String(t || "").replace(/^[^:]+:/, "").replace(/^what\/is\/\w+\//, "").replace(/\.md$/, "");

function renderMachine(L) {
  $("lanes").innerHTML = `<h3>Lanes</h3>` + Object.entries(L.models).map(([name, m]) =>
    L.lanes.filter(l => l.model === name).map(l => {
      const holder = L.thoughts[l.holder];
      const who = holder ? `<span class="chip held">${esc(holder.agent)}</span>`
        : `<span class="muted">${m.up ? "free" : m.launching ? "launching" : "down"}</span>`;
      return `<div class="lane-row"><span class="name">${esc(short(name))}</span><span class="muted">lane ${l.index}</span>${who}</div>`;
    }).join("")).join("");
  renderMemory({memory: L.memory, models: L.models, model_memory: L.model_memory, guard: L.guard,
                saved_bytes: Object.values(L.snapshots).filter(s => s.tier === "memory").reduce((n, s) => n + s.bytes, 0)});
}

const MEMORY_COLOURS = [["In use / reserved", "#9f3b52"], ["Available", "#ece3e0"]];

function renderMemory(M) {
  // MemAvailable is an availability estimate, not free pages. Admission budgets and
  // snapshot file lengths cannot partition physical RAM into resident allocations.
  const m = M.memory || {};
  if (m.physical_gb === undefined) return;
  const gib = gb => gb * 1e9 / 2 ** 30;
  const physical = gib(m.physical_gb), available = Math.min(physical, Math.max(0, gib(m.available_gb)));
  const values = [physical - available, available];
  const loaded = Object.entries(M.models || {}).filter(([, model]) => model.up)
    .map(([name]) => M.model_memory[name]);
  const weights = gib(loaded.reduce((n, x) => n + x.weights_gb, 0));
  const runtimeBudget = gib(loaded.reduce((n, x) => n + x.memory_gb - x.weights_gb, 0));
  const saved = (M.saved_bytes || 0) / 2 ** 30;
  MEMORY_PARTS = MEMORY_COLOURS.map(([name, colour], i) => [name, values[i], colour]);
  if (!$("donut")) {
    $("memory").innerHTML = `<h3>Memory</h3><div class="mem">` +
      `<svg viewBox="0 0 160 160" class="donut" id="donut" onmouseleave="focusPart(-1)">` +
      MEMORY_COLOURS.map(([, colour], i) => `<circle class="seg" data-i="${i}" r="58" cx="80" cy="80" fill="none" stroke="${colour}"` +
        ` stroke-width="24" transform="rotate(-90 80 80)" onmouseenter="focusPart(${i})"></circle>`).join("") +
      `<text x="80" y="76" class="big" id="donut-value"></text><text x="80" y="96" class="small" id="donut-label"></text></svg>` +
      `<div class="legend">` + MEMORY_COLOURS.map(([name, colour], i) =>
        `<div class="item" data-i="${i}" onmouseenter="focusPart(${i})" onmouseleave="focusPart(-1)"><i style="background:${colour}"></i>` +
        `<span>${name}</span><b></b><em></em></div>`).join("") + `</div></div><div class="memdetail" id="memdetail"></div><div class="memfacts" id="memfacts"></div>`;
  }
  const total = values.reduce((n, v) => n + v, 0), C = 2 * Math.PI * 58, gap = 2;
  let at = 0;
  document.querySelectorAll("#donut .seg").forEach((seg, i) => {
    const length = total ? values[i] / total * C : 0, arc = Math.max(0, length - gap);
    seg.setAttribute("stroke-dasharray", `${arc} ${C - arc}`);
    seg.setAttribute("stroke-dashoffset", `${-at}`);
    at += length;
  });
  document.querySelectorAll(".legend .item").forEach((item, i) => {
    setText(item.querySelector("b"), `${values[i].toFixed(1)} GiB`);
    setText(item.querySelector("em"), `${total ? Math.round(values[i] / total * 100) : 0}%`);
  });
  setHTML($("memdetail"), `<div><span><i style="background:#9f3b52"></i>Model weights</span><b>~${weights.toFixed(1)} GiB</b><small>configured estimate</small></div>` +
    `<div><span><i style="background:#e9687e"></i>KV-cache / runtime</span><b>~${runtimeBudget.toFixed(1)} GiB</b><small>configured load estimate, not measured use</small></div>` +
    `<div><span><i style="background:#ec98a5"></i>Saved contexts</span><b>${saved.toFixed(1)} GiB</b><small>files in memory tier</small></div>` +
    `<div><span><i style="background:#28262b"></i>OS / applications</span><b>—</b><small>included in use; not separately measured</small></div>`);
  setHTML($("memfacts"), `pressure ${m.psi} · swap ${gib(m.swap_gb).toFixed(2)} GiB` +
    `<br>Detail figures are not additive. Available includes reclaimable memory.` +
    (M.guard && M.guard.blocked ? ` · <b>background waiting for memory</b>` : "") + (M.guard && M.guard.killed ? ` · <b>work model killed</b>` : ""));
  focusPart(FOCUSED);
}

let MEMORY_PARTS = [], FOCUSED = -1;
function focusPart(i) {
  FOCUSED = i;
  if (!$("donut")) return;
  document.querySelectorAll("#donut .seg").forEach(seg => seg.style.opacity = i < 0 || +seg.dataset.i === i ? 1 : .35);
  document.querySelectorAll(".legend .item").forEach(item => item.classList.toggle("on", +item.dataset.i === i));
  const total = MEMORY_PARTS.reduce((n, p) => n + p[1], 0);
  setText($("donut-value"), i < 0 ? `${total.toFixed(0)} GiB` : `${MEMORY_PARTS[i][1].toFixed(1)} GiB`);
  setText($("donut-label"), i < 0 ? "memory" : MEMORY_PARTS[i][0].toLowerCase());
}

function renderChecks(L) {
  const failing = L.checks.filter(c => !c.ok);
  $("checks").innerHTML = !L.checks.length ? "" : failing.length
    ? failing.map(c => `<div class="check no"><b>${esc(c.name)}</b> ${esc(c.detail)}</div>`).join("")
    : `<div class="check ok">✓ All ${L.checks.length} self-checks pass</div>`;
}

function sentence(h) {
  const lane = h.model ? `${short(h.model)} lane ${h.lane}` : `lane ${h.lane}`;
  switch (h.event) {
    case "agent started": return `${h.agent} started on ${short_task(h.task)} (run ${h.run})`;
    case "agent ended": return `${h.agent} ended: ${h.reason}`;
    case "agent adopted": return `${h.agent} carried on through a daemon restart`;
    case "task created": return `new task: ${short_task(h.task)}`;
    case "task finished": return `${short_task(h.task)} finished: ${h.detail}`;
    case "switch": return `${lane}: ${h.out ? short_task(h.out) : "empty"} → ${short_task(h.into)}` +
      (h.restored ? ` (restored ${h.restored.toLocaleString()} tokens)` : " (cold)") + (h.saved ? ", saved the outgoing" : "");
    case "shared prefix saved": return `shared start saved: ${h.tokens.toLocaleString()} tokens`;
    case "snapshot forgotten": return `forgot a snapshot of ${short_task(h.owner)}: ${h.reason}`;
    case "saved on stop": return `${lane}: saved ${short_task(h.owner)} as the daemon stopped`;
    case "snapshots moved to disk for shutdown": return `moved ${h.count} saved contexts to disk for shutdown`;
    case "model up": return `${short(h.model)} is up`;
    case "viewer": return `viewer ${h.slot} now shows ${h.agent}`;
    case "alert": return h.text;
    default: {
      const {at, event, ...rest} = h;
      return `${event}${Object.keys(rest).length ? ": " + Object.entries(rest).map(([k, v]) => `${k} ${typeof v === "object" ? JSON.stringify(v) : v}`).join(", ") : ""}`;
    }
  }
}

function render(L) {
  const agents = Object.values(L.agents), failing = L.checks.filter(c => !c.ok);
  const count = s => Object.values(L.tasks).filter(t => t.status === s).length;
  const thinking = agents.filter(a => a.state === "thinking").length;
  $("stamp").textContent = "updated " + new Date(L.updated_at * 1000).toLocaleTimeString();
  $("summary").innerHTML = `<span class="dot ${failing.length ? "bad" : ""}"></span>` +
    (L.paused ? `<b>Paused.</b> ` : "") +
    `<b>${agents.length} agent${agents.length === 1 ? "" : "s"}</b> at work, ${thinking} thinking right now · ` +
    `${count("waiting")} task${count("waiting") === 1 ? "" : "s"} up next · ${count("done")} done` +
    (failing.length ? ` · <b>self-check red</b>` : "");
  $("alert").innerHTML = failing.map(c => esc(c.name + ": " + c.detail)).join("<br>");
  LAST = {paused: L.paused, guard: L.guard};
  renderAgents(L);
  renderWork(L);
  renderMachine(L);
  renderChecks(L);
  $("history").innerHTML = L.history.slice(-60).reverse().map(h =>
    `<div class="${h.event === "alert" ? "alert-line" : ""}"><span class="when">${new Date(h.at * 1000).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"})}</span>` +
    `<span class="what">${esc(sentence(h))}</span></div>`).join("");
}

let LAST = {paused: false, guard: {}};
async function poll() {
  try { render(await (await fetch("/api/ledger", {cache: "no-store"})).json()); }
  catch (e) { $("stamp").textContent = "daemon unreachable"; }
  setTimeout(poll, 1000);
}
poll();
// Agent cards and memory, ten times a second.
new EventSource("/api/live").onmessage = event => {
  const F = JSON.parse(event.data);
  renderAgents({...F, paused: LAST.paused});
  renderMemory({...F, guard: LAST.guard});
};
</script>
</body>
