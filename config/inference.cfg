# Candidate inference slot policy for the local Qwen backend.
#
# The eight work request slots share ONE shared backend context pool of
# 262144 tokens: they are time-shared request slots, not eight fully
# reserved contexts of 262144 tokens each. The single front slot admits
# incoming requests. This policy does not implement shared KV caching or
# model residency.
#
# This candidate policy awaits caller migration and activation; nothing
# reads this file at runtime yet. Fixed mode remains supported because the
# contingency backend and the tests use it; this candidate selects shared.
[inference]
work_slots = 8
front_slots = 1
context_tokens_per_slot = 262144
backend_context_tokens = 262144
context_mode = shared
