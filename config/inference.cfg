# Candidate inference slot policy for the local Qwen backend.
#
# One Qwen weight copy is loaded for the backend: the two work request
# slots share that single copy on fixed time-shared partitions, and the
# single front slot admits incoming requests. This fixed-partition policy
# does not implement shared KV caching or model residency.
#
# This candidate policy awaits caller integration and activation; nothing
# reads this file at runtime yet.
[inference]
work_slots = 2
front_slots = 1
context_tokens_per_slot = 131072
